# 优先使用六维模型结构化输出中的 band。只有历史结果没有 band 时才使用此回退。
band_fallback:
  excellent:
    min_score: 80
  good:
    min_score: 60
  marginal:
    min_score: 50
  unacceptable:
    min_score: 0

decision_mapping:
  confirmed_gate_failure: decline_without_review
  defect_rule:
    dimensions:
      - problem_originality
      - analytical_framework
      - logical_coherence
    band: unacceptable
    decision: decline_without_review
  direct_accept_rule:
    dimensions:
      - problem_originality
      - literature_insight
      - analytical_framework
      - logical_coherence
      - conclusion_consensus
      - forward_extension
    all_dimensions_min_band: good
    required_bands:
      logical_coherence: excellent
    core_dimensions:
      - problem_originality
      - literature_insight
      - analytical_framework
      - logical_coherence
    core_excellent_min_count: 3
    decision: priority_external_review
  minor_accept_rule:
    dimensions:
      - problem_originality
      - literature_insight
      - analytical_framework
      - logical_coherence
      - conclusion_consensus
    min_band: good
    decision: send_external_review
  fallback_decision: revise_resubmit
  forward_extension:
    may_promote_to_direct_accept: true
    never_downgrade: true
  excluded_from_decision:
    - position_assessment
    - ccb

journal_fit:
  output_contract:
    status:
      - pass
      - boundary
      - reject
    required_fields:
      - status
      - reasons
      - evidence_quotes
      - requires_editor_confirmation
  prompt_template: |
    你是“{journal_name}”编辑部的投稿适配性辅助检查器。
    本刊关注：{fit_focus}。
    这里只判断稿件与本刊范围、栏目定位和读者对象的适配性，不重复六维学术质量评分，
    不因观点立场不同判定不适配。请只输出符合契约的 JSON。

opinion:
  synthesis_prompt_template: |
    你是法学期刊编辑部的智能辅助意见综合器，负责把多轮独立评审与交叉复核的结果汇总为一份编辑可读的综合意见。
    行文须用法学编辑评审语言，贴近法学论文审稿习惯；意见正文中不得出现模型名称、评分维度编号、等级代码等工程化术语，只用法学术语与编辑评审语言。
    不得虚构法条、文献、作者观点或评审材料未支持的事实；位置归属判断只反映知识体系定位，不得当作论文质量结论。
    评价等级只能写成“优、良、中、差”，不得输出 excellent、good、marginal、unacceptable。

    下方将追加评审材料 JSON，其结构为：各评审维度的评分与档位、各评审方的原文证据片段与分析、分歧等级（共识/观点差异/必须专家复核）、综合参考分与知识体系定位。综合意见须以这些材料为唯一依据，优先依据原文证据片段与分析，不得引述材料未出现的事实。

    synthesis 与 modification_suggestions 面向投稿人，须用作者可读的法学编辑语言，不得出现评审方编号、共识、分歧等内部评审机制措辞；consensus_points、disagreement_points、priority_issues 供编辑内部使用。

    synthesis 须先以一两句开篇，肯定选题的意义或价值（若材料支持），再转入问题与判断；可直接给出凝练的定性判断，避免“论证薄弱”“建议加强论证”等无证据锚定的空泛套话。
    consensus_points 写评审共识；disagreement_points 写普通观点差异，须保留不同评审方的张力（如“部分评审认为……，另一部分认为……”），不得合并为单一声音；必须专家复核的分歧写入 priority_issues 并标注“需专家复核”。
    modification_suggestions 为字符串数组，每条须对应 priority_issues 中的某一问题，以“【必改】”或“【可选】”开头，随后引用材料中已有的原文证据片段或法条/学界观点作为依据，给出可操作的改法；不得返回对象或其他结构。

    请显式区分评审共识、普通观点差异和必须专家复核的分歧，只输出 JSON：
    {
      "synthesis": "综合意见",
      "consensus_points": ["评审共识"],
      "disagreement_points": ["评审分歧"],
      "priority_issues": ["编辑应优先核验的问题"],
      "modification_suggestions": ["综合修改建议"]
    }
  synthesis_model: qwen3.7-max-2026-06-08
  display_order:
    - ai_synthesis
  labels:
    ai_synthesis: 智能辅助综合意见
    editor_final: 编辑最终意见
