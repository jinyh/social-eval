metadata:
  name: 法学评价框架 v2.50.2（负面模式嵌入评分锚定）
  version: 2.50.2
  discipline: 法学
  source: v2.47 + 负面模式嵌入评分锚定
  created: '2026-05-14'
  previous_version: 2.50.1
  status: baseline
  changelog: 'v2.50.2 维度命名更新（2026-05-22）：

    - 统一维度中文名称：研究创新性、理论建构力、逻辑连贯性、学术共识度

    - 与 v2.55 标准命名对齐


    v2.50.2 变化（2026-05-14，负面模式嵌入评分锚定）：

    【目标】修复 v2.50.1 中分析框架和结论维度扣分指令被忽略的问题。


    核心变化：

    1. 问题创新性：保留前置扣分（v2.50.1 已验证有效）

    2. 分析框架：将负面模式检测嵌入"第一步：框架可操作性检查"的评分流程中

    3. 结论可接受性：将负面模式检测嵌入"轨道A/B"的评分流程中

    4. 不再使用独立的"扣分步骤"，而是直接限制子项得分上限


    设计原理：

    - v2.50.1 证明：独立的前置扣分在长 prompt 中会被后续评分标准覆盖

    - 新策略：将负面模式检测嵌入评分步骤本身，AI 在逐项评分时自然考虑

    - 使用"子项得分上限"而非"总分扣分"，更难被忽略


    预期改进：

    - 分析框架维度：邵莉莉 < 65、崔聪聪 < 60、包晓丽 < 70

    - 结论可接受性维度：杨清望 < 60（生搬硬套）'
std_threshold: 5.0
enums:
  review_flags:
    common:
    - key: boundary_overlap
      name_zh: 维度边界模糊
      description: 评分依据与其他维度重叠，需人工判断归属
      action: 标记供专家复核，检查是否需要调整 rubric
    - key: evidence_thin
      name_zh: 证据不足
      description: 文本证据不足以支撑判断，需更多上下文
      action: 降低该维度权重或标记为'需补充材料'
    - key: mandatory_expert_review
      name_zh: 必须专家复核
      description: 触发 v0.8 强制复核规则，AI 不得作最终裁断
      action: 汇总报告中优先呈现证据、分歧和需专家裁断的问题
    - key: none
      name_zh: 无需复核
      description: 判断清晰，无需人工介入
      action: 直接采纳评分
    dimension_specific:
      problem_originality:
      - key: problem_validity_unclear
        name_zh: 问题是否成立不清楚
        description: 无法判断论文是否提出了真问题
        action: 需专家判断问题意识
      - key: material_novelty_overclaim
        name_zh: 材料新颖性误判风险
        description: 论文主要依赖新案例、新材料或新概念宣称创新，但未显示其改变问题设定、解释路径、规范命题或结论推进
        action: 不得因材料新颖直接给高分；标记供专家复核
      literature_insight:
      - key: needs_external_context
        name_zh: 需要外部文献数据库验证
        description: 无法从文内判断文献覆盖充分性
        action: 建议接入外部文献数据库或专家复核
      - key: external_context_conflict
        name_zh: 外部文献冲突
        description: 增强模式下外部文献显示可能遗漏关键争点，且文内研究地图较弱
        action: 不由 AI 直接裁断，进入专家复核
      analytical_framework:
      - key: concept_instability
        name_zh: 概念使用不稳定
        description: 核心概念前后使用不一致
        action: 标记为概念问题，可能影响逻辑严密性
      logical_coherence:
      - key: counterargument_missing
        name_zh: 缺少反驳处理
        description: 未处理明显反对意见或例外情形
        action: 标记为论证不完整
      conclusion_consensus:
      - key: community_dialogue_gap
        name_zh: 共同体对话缺口
        description: 结论无法进入共同体语境
        action: 需专家判断是否为创新突破或自说自话
      forward_extension:
      - key: future_claim_thin
        name_zh: 未来延展依据薄弱
        description: 延展路径与正文论证脱节
        action: 标记为展望空泛
      precheck_specific:
      - key: text_quality_risk
        name_zh: 文本工程风险
        description: OCR/分栏/脚注/参考文献抽取等文本工程问题
        action: 记录但不触发项目口径复核
      - key: project_scope_boundary
        name_zh: 项目口径边界
        description: 只满足部分项目口径信号，需专家裁断
        action: 进入六维评分但标记为边界稿
      - key: ethics_risk
        name_zh: 学术伦理风险
        description: 存在学术伦理疑点
        action: 进入人工或外部工具复核
  precheck_status:
  - key: pass
    name_zh: 通过
    description: 基本符合要求，可进入六维评分
    condition: 三项检查均无问题
  - key: conditional_pass
    name_zh: 有条件通过
    description: 存在需要专家后续关注的风险，但仍具备进入六维评分的可评性
    condition: 存在引用规范、事实核验或写作结构风险，但不至于导致全文不可评
    examples:
    - 参考文献表和脚注不完全一致，但核心论点仍可定位
    - 存在若干需要人工核验的新近文献、预印本或事实性表述
    - 结构层级略乱或表述欠清晰，但不影响六维评分的基本可执行性
  - key: manual_review
    name_zh: 需人工复核
    description: 单模型判断中用于标记明显风险，聚合后通常折算为 conditional_pass
    condition: 单个模型认为存在明显疑点，需要人工核验
    examples:
    - 学术伦理疑点（抄袭嫌疑、案例真实性疑点、数据真实性疑点）
    - 大量引用错误或伪引信号，但全文仍可读
  - key: reject
    name_zh: 拒绝进入评分
    description: 稿件当前不可评，必须修订或人工确认后方可重新进入流程
    condition: 文本严重不可读、主体内容残缺或存在明确不可继续评审的硬阻断线索
    examples:
    - 文件损坏、OCR 基本失败或大面积乱码，无法定位核心论点
    - 正文严重缺页或主体内容缺失，六维评分无法执行
    - 出现明确伪造、严重学术伦理红线或明显虚构法源的强证据
precheck:
  name: 文本质量与项目口径分层预检
  mode: text_quality_and_project_scope
  description: v0.16 预检分层：先识别 OCR/排版/脚注等文本工程风险，再独立判断是否具有进入中国自主知识体系项目六维评价的文内候选信号。
  criteria:
  - key: text_quality
    name_zh: 文本工程质量
    description: 检查 OCR、分栏、脚注、页码、参考文献抽取等文本工程问题是否影响核心论点定位；可读但有瑕疵时只标记 text_quality_risk，不触发项目口径边界复核
    pass_required: true
  - key: project_scope
    name_zh: 项目口径信号
    description: 检查中国问题、法学问题、中国实践解释尝试、理论转化或可复核命题，决定是否进入六维评分、边界复核或明显不适格人工确认
    pass_required: true
  - key: academic_ethics
    name_zh: 学术伦理
    description: 仅做学术伦理疑点筛查；不得把 OCR/排版残留写成已经成立的学术不端结论
    pass_required: true
    review_required: true
  prompt_template: "请对这篇法学论文进行【阶段1：项目口径预检】。\n\n正式流程只有一个阶段1任务：判断论文是否进入评分、边界复核或明显不适格。text_quality_gate 只是旁路工程字段，用于记录 OCR/分栏/脚注/参考文献抽取风险，不是独立评审阶段，也不得取代项目口径判断。\n\n【主任务：project_scope_precheck】\n判断论文是否具有进入“中国自主知识体系研究”六维评价的文内候选信号：\n1. 是否涉及中国问题：制度、规范、司法、治理、社会实践、法学争论或文化资源中的中国问题。\n2. 是否有法学问题：可争辩的法律规范、制度、理论或法哲学问题，而非纯政策复述或材料堆砌。\n3. 是否有中国实践解释尝试：是否解释中国实践中的真实难题，而非只把中国材料作为背景。\n4. 是否有理论转化或可复核命题：是否形成法学概念、判断标准、解释路径、制度命题或规范命题。\n\nproject_scope_precheck 的三种结论：\n- enter_six_dimension_review：以中国问题为中心且有可争辩法学问题；或已把外部理论/比较法/文化资源转化为中国法学分析工具或可复核命题。\n- boundary_review：只满足部分项目口径信号，需要专家裁断是否属于本项目，但仍进入六维评分。\n- obviously_ineligible：缺少中国问题中心性，且没有中国实践解释、理论转化或可复核命题；或完全不能定位可争辩法学问题。\n\n【旁路字段：text_quality_gate】\n同时记录文本工程质量：\n- ok：文本质量足以评审。\n- risk：存在局部格式/脚注/OCR风险，但核心论点、结构和主要论证仍可定位。\n- block：正文严重不可读、主体缺页、核心论点无法定位，当前不可评分。\n\n重要：不得因可读文本中的 OCR 残留、脚注编号乱码、期刊页码混入或参考文献列表抽取失败，直接输出项目口径 boundary_review。这些问题应进入 text_quality_gate.issues，而不是 project_scope_precheck.boundary_reasons。\n\n输出兼容字段 status：\n- text_quality_gate.status=block 时 status=reject。\n\
    - project_scope_precheck.conclusion=obviously_ineligible 时 status=reject。\n- project_scope_precheck.conclusion=boundary_review 时 status=manual_review。\n- 其他可评分但有文本质量风险时 status=conditional_pass。\n- 完全正常时 status=pass。\n\n请只输出 JSON：\n{\n  \"status\": \"pass|conditional_pass|manual_review|reject\",\n  \"conclusion\": \"enter_six_dimension_review|boundary_review|obviously_ineligible\",\n  \"enter_six_dimension_review\": \"yes|boundary|no\",\n  \"text_quality_gate\": {\n    \"status\": \"ok|risk|block\",\n    \"risk_level\": \"none|low|medium|high\",\n    \"issues\": [\"文本工程问题\"],\n    \"evidence_quotes\": [\"原文片段\"]\n  },\n  \"project_scope_precheck\": {\n    \"conclusion\": \"enter_six_dimension_review|boundary_review|obviously_ineligible\",\n    \"triggered_signals\": {\n      \"involves_china_issues\": \"yes|no|partial|uncertain\",\n      \"has_legal_question\": \"yes|no|partial|uncertain\",\n      \"china_practice_explanation_attempted\": \"yes|no|partial|uncertain\",\n      \"theory_transformation_or_verifiable_thesis\"\
    : \"yes|no|partial|uncertain\"\n    },\n    \"evidence_quotes\": [\"项目口径证据\"],\n    \"boundary_reasons\": [],\n    \"obviously_ineligible_reasons\": []\n  },\n  \"triggered_signals\": {\n    \"involves_china_issues\": \"yes|no|partial|uncertain\",\n    \"has_legal_question\": \"yes|no|partial|uncertain\",\n    \"china_practice_explanation_attempted\": \"yes|no|partial|uncertain\",\n    \"theory_transformation_or_verifiable_thesis\": \"yes|no|partial|uncertain\"\n  },\n  \"issues\": [\"只放需要后续关注的问题，区分文本工程与项目口径\"],\n  \"evidence_quotes\": [\"最关键证据\"],\n  \"boundary_reasons\": [],\n  \"obviously_ineligible_reasons\": [],\n  \"requires_manual_confirmation\": true/false,\n  \"review_flags\": [\"text_quality_risk|project_scope_boundary|ethics_risk|none\"],\n  \"recommendation\": \"处理建议\"\n}\n"
  output_contract:
    description: v0.16 分层预检输出契约；文本工程风险与项目口径边界分开输出
    required_fields:
    - text_quality_gate
    - project_scope_precheck
    - conclusion
    - enter_six_dimension_review
    - triggered_signals
    - evidence_quotes
    - boundary_reasons
    - obviously_ineligible_reasons
    - requires_manual_confirmation
    field_constraints:
      conclusion:
        allowed_values:
        - enter_six_dimension_review
        - boundary_review
        - obviously_ineligible
        description: 预检结论，决定论文是否进入六维评分
      enter_six_dimension_review:
        allowed_values:
        - 'yes'
        - boundary
        - 'no'
        description: 是否进入六维评分的三档判断
      triggered_signals:
        description: 四项核心信号的判断结果
        required_keys:
        - involves_china_issues
        - has_legal_question
        - china_practice_explanation_attempted
        - theory_transformation_or_verifiable_thesis
        value_enum:
        - 'yes'
        - 'no'
        - partial
        - uncertain
      evidence_quotes:
        type: array
        max_count: 3
        max_chars_per_quote: 80
        description: 预检证据片段，引用原文具体段落
      boundary_reasons:
        type: array
        description: 若 conclusion=boundary_review，说明为何需要复核
      obviously_ineligible_reasons:
        type: array
        description: 若 conclusion=obviously_ineligible，说明为何判定为明显不适格
      requires_manual_confirmation:
        type: boolean
        description: 是否需要人工确认
    optional_fields:
    - status
    - issues
    - review_flags
    - recommendation
    field_priority:
      description: 'v0.16 模式下代码优先使用 conclusion 字段（三值枚举）；

        status 字段仅在 conclusion 缺失时作为 fallback（通过 _CONCLUSION_MAPPING 映射）。

        模型应同时输出两者以保证向后兼容。

        '
    field_relationships:
      description: 'conclusion 是权威字段（三值枚举：enter_six_dimension_review / boundary_review / obviously_ineligible）。

        enter_six_dimension_review 是 conclusion 的简写映射（yes=enter_six_dimension_review, boundary=boundary_review, no=obviously_ineligible）。

        project_scope_precheck.conclusion 必须与顶层 conclusion 一致。

        代码以顶层 conclusion 为准。

        '
autonomous_knowledge_signals:
  stage: 3
  name: 自主知识体系信号校验
  description: '独立检查步骤，整理文内可观察的自主知识体系信号；

    复用六维评分的分析结果，避免重复阅读；

    结果不进入基础分公式，只作为辅助信息和复核触发条件。

    '
  not_scoring_dimension: true
  role:
  - 证据整理：在输出报告中呈现，供人工复核参考
  - 维度辅助：作为六维评分的相关证据或风险提示
  - 复核触发：与六维结果矛盾时触发评价层复核
  prompt_template: "请对这篇法学论文进行【阶段3：自主知识体系信号校验】（v0.16 YAML 配置版）。\n\n本步骤是独立的特征提取步骤，不是第七个评分维度，不进入基础分公式。\n你的任务是整理文内可观察的自主知识体系信号，用于辅助六维评分、候选分层和评价层复核判断。\n\n请检查以下四类核心信号：\n\n1. 中国问题中心性：\n   论文是否围绕中国制度、规范、司法、治理、社会实践或中国法学争论提出问题。\n   判断值：yes / no / partial / uncertain。\n\n2. 中国实践解释尝试：\n   论文是否尝试解释中国实践中的真实难题，而非只把中国材料作为背景或例证。\n   判断值：yes / no / partial / uncertain。\n\n3. 外部理论转化动作：\n   论文是否把西方理论、域外制度、比较法或跨学科理论转化为服务中国问题的法学概念、判断标准、解释步骤或规范命题。\n   判断值：sufficient / partial / insufficient / not_applicable / uncertain。\n\n4. 可复核概念或命题：\n   论文是否提出可定位、可复述、可检验的概念、类型、机制、解释框架或规范命题。\n   判断值：yes / no / partial / uncertain。\n\n请同时识别以下辅助信息：\n\n- 是否涉及中国特殊制度议题：yes / no / uncertain。\n- 议题类型：party / intra_party_regulation / supervision / state_governance / other。\n- 是否使用传统文化或本土概念资源：yes / no / uncertain。\n\n典型风险只能从以下列表中选择，也可在确有必要时补充自定义风险：\n\n- policy_restatement_without_legal_thesis\n- tradition_as_value_claim_without_legal_transformation\n- china_material_as_background_only\n- direct_transplant_without_context_transformation\n\
    - slogan_inflation_without_legal_argument\n- power_allocation_without_process_control\n\n信号量化要求：\n\n- 四项核心信号分别按 0/1/2 输出 signal_scores。\n- 2 表示 yes / sufficient / not_applicable。\n- 1 表示 partial / uncertain。\n- 0 表示 no / insufficient。\n- uncertain 仅在文本证据相互冲突或确有局部证据但不足以判断时使用；无证据应选 no / insufficient。\n- autonomous_signal_score 为四项分数总和，范围 0-8。\n- autonomous_signal_strength：strong=7-8，medium=4-6，weak=1-3，absent=0。\n- 量化结果只用于排序、分层抽检、专家复核优先级和第二阶段引文分析结合；不得进入六维基础分。\n\n矛盾触发条件：\n\n- total_high_but_no_china_problem：final_score（最终总分）> 70 且 china_problem_centered == no 或 china_practice_explanation_attempted == no。\n- total_low_but_all_signals_yes：final_score（最终总分）< 50 但四项 signal_scores 均为 2（强信号）。\n- high_originality_but_no_verifiable_thesis：研究创新性 >= 80 但 verifiable_concept_or_thesis == no。\n- slogan_heavy_but_no_legal_question：正文大量使用“中国特色”“自主知识体系”“文化主体性”等标识性概念，但无法定位具体法学问题。\n\n请只输出 JSON，不要输出 Markdown 代码块或额外说明：\n\n{output_template}\n"
  output_template: "{\n  \"china_problem_centered\": \"yes/no/partial/uncertain\",\n  \"china_practice_explanation_attempted\": \"yes/no/partial/uncertain\",\n  \"external_theory_transformation\": \"sufficient/partial/insufficient/not_applicable/uncertain\",\n  \"verifiable_concept_or_thesis\": \"yes/no/partial/uncertain\",\n  \"signal_scores\": {\n    \"china_problem_centered\": 0-2,\n    \"china_practice_explanation_attempted\": 0-2,\n    \"external_theory_transformation\": 0-2,\n    \"verifiable_concept_or_thesis\": 0-2\n  },\n  \"autonomous_signal_score\": 0-8,\n  \"autonomous_signal_strength\": \"strong/medium/weak/absent\",\n  \"involves_special_chinese_institutional_issue\": \"yes/no/uncertain\",\n  \"issue_types\": [\"party/intra_party_regulation/supervision/state_governance/other\"],\n  \"uses_traditional_cultural_resource\": \"yes/no/uncertain\",\n  \"evidence_quotes\": [\"原文证据1\", \"原文证据2\"],\n  \"risks\": [],\n  \"triggers_review\": true/false,\n  \"review_reason\": \"\"\n}\n"
  signals:
  - key: china_problem_centered
    name_zh: 中国问题中心性
    description: 论文是否围绕中国制度、规范、司法、治理、社会实践或中国法学争论提出问题
    values:
    - 'yes'
    - 'no'
    - partial
    - uncertain
  - key: china_practice_explanation_attempted
    name_zh: 中国实践解释尝试
    description: 论文是否尝试解释中国实践中的真实难题，而非只把中国材料作为背景或例证
    values:
    - 'yes'
    - 'no'
    - partial
    - uncertain
  - key: external_theory_transformation
    name_zh: 外部理论转化动作
    description: 论文是否把西方理论/域外制度/比较法/跨学科理论转化为服务中国问题的法学概念、判断标准、解释步骤或规范命题
    values:
    - sufficient
    - partial
    - insufficient
    - not_applicable
    - uncertain
  - key: verifiable_concept_or_thesis
    name_zh: 可复核概念或命题
    description: 论文是否提出可定位、可复述、可检验的概念、类型、机制、解释框架或规范命题
    values:
    - 'yes'
    - 'no'
    - partial
    - uncertain
  quantification:
    enabled: true
    score_range:
    - 0
    - 8
    aggregation_strategy: conservative_on_disagreement
    mapping:
      score_2:
      - 'yes'
      - sufficient
      - not_applicable
      score_1:
      - partial
      - uncertain
      score_0:
      - 'no'
      - insufficient
    strength_bands:
      strong: 7-8
      medium: 4-6
      weak: 1-3
      absent: '0'
    usage:
    - 候选池排序
    - 分层抽检
    - 专家复核优先级
    - 第二阶段引文分析结合项
    guardrail: 不进入六维基础分，不作为第七评分维度，不单独决定高分或低分
  auxiliary_metadata:
  - key: involves_special_chinese_institutional_issue
    name_zh: 是否涉及中国特殊制度议题
    values:
    - 'yes'
    - 'no'
    - uncertain
  - key: issue_types
    name_zh: 议题类型（若涉及）
    values:
    - party
    - intra_party_regulation
    - supervision
    - state_governance
    - other
  - key: uses_traditional_cultural_resource
    name_zh: 是否使用传统文化或本土概念资源
    values:
    - 'yes'
    - 'no'
    - uncertain
  typical_risks:
  - policy_restatement_without_legal_thesis
  - tradition_as_value_claim_without_legal_transformation
  - china_material_as_background_only
  - direct_transplant_without_context_transformation
  - slogan_inflation_without_legal_argument
  - power_allocation_without_process_control
  contradiction_triggers:
  - rule: total_high_but_no_china_problem
    condition: final_score > 70 AND (china_problem_centered == "no" OR china_practice_explanation_attempted == "no")
    action: 触发评价层复核
  - rule: total_low_but_all_signals_yes
    condition: final_score < 50 AND signal_scores 四项均 == 2（强信号）
    action: 触发评价层复核（疑似 AI 误判）
  - rule: high_originality_but_no_verifiable_thesis
    condition: problem_originality >= 80 AND verifiable_concept_or_thesis == "no"
    action: 触发评价层复核
  - rule: slogan_heavy_but_no_legal_question
    condition: 正文大量使用"中国特色/自主知识体系/文化主体性"等标识性概念，但无法定位具体法学问题
    action: 触发评价层复核
    execution: prompt_side_only
  output_contract:
    required_fields:
    - china_problem_centered
    - china_practice_explanation_attempted
    - external_theory_transformation
    - verifiable_concept_or_thesis
    - signal_scores
    - autonomous_signal_score
    - autonomous_signal_strength
    - involves_special_chinese_institutional_issue
    - evidence_quotes
    - risks
    - triggers_review
    optional_fields:
    - issue_types
    - uses_traditional_cultural_resource
    - review_reason
    - signal_model_agreement
    - per_model_signal_scores
    field_constraints:
      evidence_quotes:
        max_count: 3
        max_chars_per_quote: 80
      risks:
        description: 从 typical_risks 中挑选，也可自定义
      triggers_review:
        type: boolean
      review_reason:
        description: 若 triggers_review=true，必填；引用具体 contradiction_triggers.rule
      signal_scores:
        description: 四项核心信号各自 0/1/2 量化结果
      autonomous_signal_score:
        type: integer
        range:
        - 0
        - 8
      autonomous_signal_strength:
        allowed_values:
        - strong
        - medium
        - weak
        - absent
    guardrails:
    - 信号结果不参与基础分计算
    - 不得单独给论文加分或扣分
    - 与六维结果明显矛盾时必须触发评价层复核
scoring_structure:
  total_max: 100
  description: 六维保留原始分用于比较；最终总分按 v0.8 沿用的 core+ceiling+bonus 协议计算。AI 只做初筛、分流、证据整理和风险标记，不替代专家终审。
  ceiling_rules_application: 多个 ceiling_rules 同时触发时，取最低上限（最严格规则优先）
scoring_protocol:
  mode: core_ceiling_bonus
  summary: v0.8 专家优先协议：核心四维形成基础分，结论可接受性决定总分上限，前瞻延展性在满足前提时最多加5分；边界稿优先进入专家复核，避免 AI 误收明显差稿。
  ai_role: initial_screening_and_risk_routing
  misuse_guardrails:
  - 不得用最终总分替代专家终审
  - 不得因结论主流、立场正确或展望宏大补救前四维缺陷
  - 不得因材料新颖、概念新潮或案例热点直接判定高创新
  - 高争议但论证扎实的论文应进入专家复核，而非自动压成差稿
  core_dimensions:
  - key: problem_originality
    weight: 0.3
  - key: literature_insight
    weight: 0.2
  - key: analytical_framework
    weight: 0.15
  - key: logical_coherence
    weight: 0.2
  ceiling_dimension:
    key: conclusion_consensus
    thresholds:
    - min_score: 75
      score_ceiling: null
    - min_score: 60
      score_ceiling: 75
    - min_score: 0
      score_ceiling: 65
  bonus_dimension:
    key: forward_extension
    max_bonus: 5
    prerequisites:
      logical_coherence_min: 60
      conclusion_consensus_min: 60
      core_dimension_min: 50
    bands:
    - min_score: 80
      bonus: 5
    - min_score: 60
      bonus: 3
    - min_score: 40
      bonus: 2
    - min_score: 0
      bonus: 0
review_positioning:
  role: AI 初筛、分流、证据整理、风险标记
  not_for:
  - 选出最终好文章
  - 替代专家审稿或主编判断
  - 裁定真实首创性、长期学术影响或实践影响
  - 作为录用、奖励、排名的唯一依据
  error_control:
    priority: 控制误收风险
    rule: 宁可把边界稿交给人工，也不能把明显差稿评成好稿
discrimination_threshold:
  description: 好/坏论文的总分差距，用于检验框架区分度
  levels:
  - level: 显著差异
    threshold: 50
    confidence: high
    action: 区分度良好
  - level: 明显差异
    threshold: 30
    confidence: medium
    action: 可接受，但边界样本需复核
  - level: 区分不足
    threshold: 0
    confidence: low
    action: 需重审 rubric 或权重
expert_review_triggers:
  dimension_triggers:
  - dimension: problem_originality
    condition: 触发问题虚化、热点拼接、材料新颖性误判风险或边界高度模糊
  - dimension: conclusion_consensus
    condition: 出现共同体对话缺口、制度可接受性争议或高分异常
  - dimension: literature_insight
    condition: 外部文献库/RAG 提示遗漏关键争点，且文内研究地图较弱
  - dimension: precheck.academic_ethics
    condition: 任何学术伦理疑点均进入人工或外部工具复核
  overall_triggers:
  - condition: 总分高但任一核心维度明显低
    action: 高分异常复核
  - condition: 研究创新性>=80 且 逻辑严密性>=75，但结论可接受性<60
    action: 不得直接视为差稿；必须由专家判断是否属于高创新高争议论文
  - condition: 材料或案例非常新，但逻辑严密性<60 或 evidence_quotes 无法证明材料改变了论证推进
    action: 标记材料创新误判风险，进入专家复核
  - condition: AI 给出高总分，但任一主评分维度 evidence_quotes 为空、泛泛引用或无法定位
    action: 证据不足高分复核
  - condition: 前瞻延展性显著高于前四维表现
    action: 检查是否用展望补救前四维缺陷
  - condition: 多模型维度分布异常一致
    action: 怀疑 rubric 迎合，提升人工抽检优先级
review_report:
  description: 复核层输出契约，声明面向专家的复核报告字段
  output_contract:
    required_fields:
    - review_type
    - review_level
    - triggered_rules
    - key_questions
    - model_divergence
    - evidence_quotes
    - risk_notes
    field_constraints:
      review_type:
        allowed_values:
        - precheck_review
        - dimension_review
        - signal_contradiction_review
        description: 复核类型，说明是预检层、维度层还是信号矛盾触发的复核
      review_level:
        allowed_values:
        - precheck_level
        - evaluation_level
        description: 复核层次，说明在哪个层次触发复核
      triggered_rules:
        type: array
        description: 触发的具体规则，从 expert_review_triggers 或 autonomous_knowledge_signals.contradiction_triggers 中引用
      key_questions:
        type: array
        description: 需要专家裁断的具体问题
      model_divergence:
        description: AI 判断分歧，说明不同模型或多次评审的分歧点
        required_keys:
        - dimension
        - scores
        - std
        - reason
        field_types:
          dimension: string
          scores: array
          std: number
          reason: string
      evidence_quotes:
        type: array
        max_count: 5
        max_chars_per_quote: 100
        description: 证据片段，引用原文具体段落
      risk_notes:
        type: array
        description: 风险提示，说明潜在风险
anchors:
  positive:
  - paper: 林来梵《民法典编纂的宪法学透析》
    source: 法学研究 2016年第4期
  - paper: 蒋红珍《比例原则位阶秩序的司法适用》
    source: 法学研究 2020年第4期
  - paper: 章志远《迈向公私合作型行政法》
    source: 法学研究 2019年第2期
  negative:
  - paper: 《论新质生产力区域协调发展的法治化之道》
    reason: 追热点式选题，问题虚构
  - paper: 《行政机关采集人脸信息活动的法治因应》
    reason: 概念混乱，理论仅为装饰
  - paper: 《对外援助立法论纲》
    reason: 文献梳理流于形式，无问题意识
decision_order:
  description: 单维评分必须按固定顺序完成；汇总判断按 v0.8 递进链条解释，禁止先凭整体印象给分或倒置补救
  steps:
  - 定位评价对象
  - 抽取关键证据
  - 判断是否触发上限规则
  - 确定分档
  - 给出最终分数
  - 输出摘要与评分理由
  aggregation_chain:
  - 命题与定位：先看研究创新性、现状洞察度
  - 工具与论证：再看分析框架建构力、逻辑严密性
  - 风险与延展：最后看结论可接受性、前瞻延展性
  prohibited_inversions:
  - 不得因结论政治正确或立场主流而补救创新不足
  - 不得因展望宏大而补救前四维塌陷
  - 不得因材料新颖而跳过论证质量检查
output_contract:
  description: 单模型、单维输出的统一结构；用于后续模型横向比较和程序校验
  required_fields:
  - dimension
  - score
  - band
  - summary
  - core_judgment
  - score_rationale
  - evidence_quotes
  - strengths
  - weaknesses
  - limit_rule_triggered
  - boundary_note
  - review_flags
  field_constraints:
    score:
      type: integer
      range:
      - 0
      - 100
      description: 最终整数分，必须服从已触发 ceiling_rules 的最低上限
    band:
      allowed_values:
      - excellent
      - good
      - marginal
      - unacceptable
      description: 先分档，再在分档内给分
    summary:
      max_chars: 50
      description: 用于报告展示的一句话摘要，不写分数
    core_judgment:
      max_chars: 80
      description: 一句话说明该维是否成立，不写分数
    score_rationale:
      max_chars: 120
      description: 一句话说明为什么是这个分数而不是更高/更低
    evidence_quotes:
      max_count: 2
      max_chars_per_quote: 80
      description: 最关键的原文证据，优先少而准
    strengths:
      max_count: 2
      max_chars_per_item: 50
    weaknesses:
      max_count: 2
      max_chars_per_item: 50
    limit_rule_triggered:
      description: 若未触发任何规则，返回空数组 []
    review_flags:
      description: 只能返回 enums.review_flags 中定义的 key
  guardrails:
  - score 缺失视为失败输出
  - 不得输出 Markdown 代码块
  - 不得输出 JSON 之外的前后缀说明
  - 不得输出未定义字段
  - summary 不得写入分数
  - core_judgment 不得写入分数
  - score 必须服从触发的最低 score_ceiling
  - 高分判断必须有可定位 evidence_quotes 支撑；证据不足不得给高分
  - review_flags 无触发时返回 ["none"]
  - 不得同时返回 none 和其他 review flag
output_constraints:
  description: 字数控制目标：每个维度500字，六维度总计3000字，专家核验时间约30分钟
  per_dimension_limits:
    evidence_quotes:
      max_count: 2
      max_chars_per_quote: 80
      description: 关键证据引用，每条不超过80字
    strengths:
      max_count: 2
      max_chars_per_item: 50
      description: 主要优势，每条不超过50字
    weaknesses:
      max_count: 2
      max_chars_per_item: 50
      description: 主要缺陷，每条不超过50字
    limit_rule_triggered:
      max_chars_per_rule: 60
      description: 触发规则说明，每条不超过60字
    boundary_note:
      max_chars: 60
      description: 维度边界说明，不超过60字
    summary:
      max_chars: 50
      description: 面向报告的一句话摘要，不超过50字
    core_judgment:
      max_chars: 80
      description: 一句话说明本维是否成立
    score_rationale:
      max_chars: 120
      description: 一句话说明分数依据和不上更高/更低分的原因
  triggered_adjustments:
    ceiling_rules_triggered:
      score_rationale_add_chars: 40
      description: 触发上限规则时，score_rationale可增加40字，用于说明规则触发依据
    review_flags_non_none:
      score_rationale_add_chars: 40
      description: 复核标记非none时，score_rationale可增加40字，用于说明复核原因
    low_score_below_40:
      score_rationale_add_chars: 30
      description: 分数低于40分时，score_rationale可增加30字，用于说明致命缺陷
  dimension_max_chars: 500
  total_max_chars: 3000
  expert_review_guidance:
    target_time_per_dimension: 5分钟
    target_time_total: 30分钟
    focus_points:
    - 检查 evidence_quotes 是否准确引用原文
    - 验证 core_judgment 和 score_rationale 中的判断逻辑是否成立
    - 确认 limit_rule_triggered 是否正确触发
    - 判断 review_flags 是否合理标记
aggregate_output_contract:
  description: v0.16 聚合层输出契约；以 final_score 为候选排序主分，同时暴露自主信号量化结果用于分层和抽检
  required_fields:
  - precheck_conclusion
  - base_score
  - bonus_score
  - conclusion_consensus_ceiling
  - final_score
  - autonomous_signal_score
  - autonomous_signal_strength
  - signal_model_agreement
  - multi_model_stats
  - review_status
  - review_level
  - triage_recommendation
  field_constraints:
    precheck_conclusion:
      allowed_values:
      - enter_six_dimension_review
      - boundary_review
      - obviously_ineligible
      description: 预检结论（从预检层透传）
    base_score:
      type: number
      range:
      - 0
      - 100
      description: 基础分 = (问题创新性×30 + 现状洞察度×20 + 分析框架建构力×15 + 逻辑严密性×20) / 85
    bonus_score:
      type: number
      range:
      - 0
      - 5
      description: 前瞻延展性加分，满足三前提时最多加 5 分
    conclusion_consensus_ceiling:
      allowed_values:
      - null
      - 75
      - 65
      description: 结论可接受性决定的总分上限，null 表示不上限
    final_score:
      type: number
      range:
      - 0
      - 100
      description: 最终总分 = min(base_score + bonus_score, conclusion_consensus_ceiling)
    autonomous_signal_score:
      type: integer
      range:
      - 0
      - 8
      description: 阶段3四项信号量化总分，只用于排序、分层、抽检和引文分析结合
    autonomous_signal_strength:
      allowed_values:
      - strong
      - medium
      - weak
      - absent
      description: 阶段3信号强度标签，不作为第七评分维度；reject 路径默认 absent
    multi_model_stats:
      description: 多模型或多次评审的统计信息
      required_keys:
      - mean
      - std
      - confidence_label
      field_types:
        mean: number
        std: number
        confidence_label: string
      confidence_label_enum:
      - high
      - medium
      - low
      - critical
    review_status:
      allowed_values:
      - none
      - recommended
      - required
      description: 复核状态，决定是否需要人工复核
    review_level:
      allowed_values:
      - precheck_level
      - evaluation_level
      - none
      description: 复核层次，若触发复核则说明在哪个层次触发
    triage_recommendation:
      allowed_values:
      - enter_six_dim
      - boundary_with_review
      - obviously_ineligible_manual_confirm
      - pass_to_expert_deep_review
      description: 分流建议，用于候选排序和复核优先级
final_report_contract:
  description: 汇总报告要求；用于执行 v0.8 的初筛和专家复核边界
  required_items:
  - 基础分
  - 前瞻延展性加分
  - 结论可接受性上限
  - 最终分
  - 复核状态：无需复核 / 建议复核 / 必须复核
  - 分流建议：明显不建议进入人工深审 / 边界稿需人工判断 / 可进入专家深审
  expert_review_packet:
  - 原文证据
  - AI 判断分歧
  - 触发复核的具体规则
  - 需要专家裁断的问题
  guardrails:
  - 不得只把 AI 最终建议推送给专家，避免锚定专家判断
  - 触发 mandatory_expert_review 时，最终报告不得写成自动录用或自动拒稿
dimensions:
- key: problem_originality
  name_zh: 研究创新性
  name_en: Problem Originality
  weight: 0.3
  position: 1
  position_name: 起点
  ai_difficulty: high
  description: '评估论文是否真正提出了可争辩的法学问题，以及该问题是否触及制度、规范或解释上的枢纽位置。材料、案例、概念或方法的新颖性只能作为辅助信号；只有当其改变问题设定、解释路径、规范命题或结论推进时，才可计入创新贡献。

    '
  evaluate:
  - 先定位论文明确提出的问题句、中心争点或待解释的规范冲突
  - 判断该问题是否是法学问题，而不只是热点主题、政策口号或现实背景
  - 判断该问题是否能牵动既有解释路径、制度结构或核心争论
  - 检查新案例、新材料、新概念或新方法是否实质改变问题设定、解释路径、规范命题或结论推进
  do_not_evaluate:
  - 不要把'首次研究'或'现实意义重大'直接当成创新
  - 不要用文献多少替代问题质量
  - 不要因为表达宏大就误判为枢纽性
  - 不要把主题声明、政策口号或权威表述的系统归纳，当作法学研究问题
  - 不要把新案例、新材料、新概念或热点对象本身当作高创新性
  - 不要在本维度重复评价材料是否支撑结论；该判断归入逻辑严密性
  ceiling_rules:
  - rule_id: problem_originality.no_justiciable_question
    trigger: 论文只描述政策背景、社会现象或现实困境，未提出任何可争辩的法学问题（含法哲学问题）
    score_ceiling: 50
    priority: 1
    severity: critical
    detection_method: 检查论文是否包含：(1)明确的问题句或争点；(2)与法律规范、法律制度或法律理论相关的讨论。若只有政策背景描述或纯事实陈述，无任何法学层面的争辩点，则触发
    examples:
    - 标题为《论新质生产力区域协调发展的法治化之道》，全文只解读政策，未提出可争辩的法学争点
    - 全文围绕社会现象描述，无法转化为法学问题
    - 纯政策建议式文章，没有任何法学论证或规范分析
    anti_examples:
    - 论文探讨司法公正的哲学基础是否可以由同理心支撑——这是法哲学问题，属于法学问题的范围，不触发此规则
    - 论文质疑某法律制度的正当性——即使论证偏宏观，也属于法学问题
  - rule_id: problem_originality.weak_problem_formulation
    trigger: 问题意识薄弱：论文宣称'填补空白'但未说明为何是问题，或问题表述过于宏大无法聚焦
    score_ceiling: 65
    priority: 2
    severity: major
    detection_method: 检查问题陈述是否包含'为什么这是问题'的论证；若只有'尚未研究'或纯宏观叙事而无具体争点，则触发
    examples:
    - 只说'该问题尚未有人研究'，但未说明为什么这是个问题
    - 问题表述过于宏大，无法聚焦到具体争点
  - rule_id: problem_originality.material_novelty_without_thesis
    trigger: 论文主要依赖新案例、新材料、新概念、新政策或新比较对象宣称创新，但未显示其改变问题设定、解释路径、规范命题或结论推进
    score_ceiling: 70
    priority: 3
    severity: major
    detection_method: 检查作者的创新依据是否主要是'新材料/新案例/新概念/新政策/新对象'；再检查原文是否说明这些材料如何改变法学问题、解释路径、规范判断或结论。若只有素材新而无实质推进，则触发
    examples:
    - 使用最新热点案例评论既有观点，但没有提出新的法学问题或解释路径
    - 引入新概念作为标题或包装，正文仍复述旧观点
    - 收集了新材料，但材料只作事实背景，没有改变规范命题或结论
    anti_examples:
    - 新案例揭示既有裁判规则无法处理的规范冲突，并由此重构解释路径
    - 新史料改变了对某项制度来源和规范目的的理解
  scoring_criteria:
    excellent:
      range:
      - 80
      - 100
      indicators:
      - 可争辩性≥2项（有明确争点+涉及法学规范或理论争议）
      - 枢纽性≥2项（问题解决牵动多方面）
      - 高分依据不得主要来自材料新颖性；若材料被计入，必须证明其带来实质研究推进
    good:
      range:
      - 60
      - 79
      indicators:
      - 可争辩性≥2项但枢纽性=1项
      - 问题成立且有推进价值，但枢纽性有限
      - 材料或方法有差异性，但对研究推进的作用仍有限
    marginal:
      range:
      - 40
      - 59
      indicators:
      - 可争辩性=1项（有主题但问题意识不稳定）
      - 现象描述多于问题提炼
    unacceptable:
      range:
      - 0
      - 39
      indicators:
      - 可争辩性=0项（无法学层面的争辩点）
      - 宏大叙事无聚焦，问题本身虚化
  boundary_notes: '与"现状洞察度"的边界：

    - 本维度评"问题本身是否成立且重要"

    - 不评文献综述是否充分，那属于现状洞察度

    '
  prompt_template: "【强制前置检查 - 负面模式扣分】\n\n⚠️ 在进行任何评分之前，必须先完成以下负面模式检查。如果跳过此步骤，后续评分无效。\n\n请逐项检查并记录扣分：\n\n□ 检查1：新概念包装旧问题（扣 15-25 分）\n  条件：论文引入新概念/新术语作为核心创新点，但未明确说明新概念相对既有概念的理论进步\n  判断方法：新概念是否只是用新词描述已有讨论？是否说明了解释力提升？\n  - 未说明任何优势 → 扣 25 分\n  - 只说\"填补空白\"但未说明解释力提升 → 扣 20 分\n  - 有部分说明但不充分 → 扣 15 分\n  - 不满足条件 → 不扣分\n\n□ 检查2：宏观介绍非深度分析（扣 15-20 分）\n  条件：论文完成了体系介绍但未触及现实问题，无不同学者观点的交锋\n  判断方法：全文是否有学者观点交锋？是否只是系统归纳既定立场？\n  - 全文无任何学者观点交锋 → 扣 20 分\n  - 有提及分歧但未展开 → 扣 15 分\n  - 不满足条件 → 不扣分\n\n□ 检查3：主题声明非研究问题（扣 20-30 分）\n  条件：全文主要是阐释既定立场，无可争辩的法学争点\n  判断方法：能否找到\"XX是否YY\"\"如何ZZ\"等问题句？还是只有主题声明？\n  - 全文无任何问题句，只有主题声明 → 扣 30 分\n  - 有问题句但实质是政策倡导 → 扣 20 分\n  - 不满足条件 → 不扣分\n\n扣分合计 = ___分（记录在 score_rationale 中）\n扣分后的分数不得低于 30 分。\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n现在开始正式评分（最终分数 = 正式评分 - 扣分合计）：\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n请对这篇法学论文的【问题创新性】进行评分（0-100分）。\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第一步：可争辩性检查（逐项计分）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n□ 标准1：是否有明确的问题句或争点\n   满足条件：能找到\"XX是否YY\"、\"如何ZZ\"、\"XX能否作为YY的基础\"等问题句\n\
    \   ✅ 成立示例：\"司法公正能否以同理心正义作为整合多元诉求的基础？\"\n   ❌ 不成立示例：\"论新质生产力的法治化\"（无问题句，只是主题声明）\n\n□ 标准2：是否涉及法学层面（而非纯政策/事实层面）\n   满足条件：问题涉及法律规范、法律制度、法律理论或法哲学争议\n   【重要】法哲学问题也是法学问题！以下都属于法学层面：\n   - 涉及法律规范的解释或适用争点\n   - 涉及法律制度的正当性或设计争点\n   - 涉及法律理论的核心争论（如形式理性vs实质理性）\n   - 涉及司法裁判的正当化基础（如正义原则能否作为裁判理由）\n   以下不属于法学层面（才是纯政策/事实）：\n   - 纯政策建议（\"应加强XX立法\"且无论证）\n   - 纯社会现象描述（\"XX问题很严重\"但无法学分析）\n   - 事实统计报告（无理论争辩点）\n\n□ 标准3：是否有理论分歧（而非共识或单向陈述）\n   满足条件：论文讨论中存在不同观点或解释路径\n   ✅ 成立示例：\"对于司法公正的基础，形式理性派认为___，实质理性派认为___\"\n   ✅ 成立示例（法哲学论文）：\"论文呈现XX概念的不同理解路径，隐含展示了理论分歧\"\n   ❌ 不成立示例：\"学界一致认为XX\"（无分歧）\n   【强制认定规则】法哲学问题=法学问题。只要论文讨论涉及法学概念的不同理解路径（而非纯哲学思辨），就存在法学层面的理论分歧。不得因论文是法哲学类型而判定\"无法学层面的分歧\"。\n\n□ 标准4：是否非政策倡导（有法学论证而非纯应然主张）\n   满足条件：论文包含法学层面的论证（而非只说\"应该XX\"）\n   ✅ 成立示例：\"基于XX法理，应当采用YY解释路径\"（有论证）\n   ❌ 不成立示例：\"应加强网络安全立法\"（无论证）\n\n【额外锚点】：\n- 主题声明、政策口号或权威表述的系统归纳，不等于法学研究问题。\n- 只要全文主要是在阐释既定立场，而非提出可争辩的法学争点，就不得因为主题重大而给高分。\n\n【v0.8 材料创新降权规则】：\n- 新案例、新数据、新史料、新概念、新比较对象只能作为辅助信号，不能单独支撑高创新性。\n- 只有当材料或方法改变了问题设定、解释路径、规范命题或结论推进时，才能计入创新贡献。\n\
    - 仅追逐热点案例、新政策、新概念，或用新材料复述旧观点，不得进入高分档。\n- 材料是否真正支撑结论，主要归入逻辑严密性判断；本维只判断材料是否带来研究问题或命题层面的推进。\n\n可争辩性得分 = 满足的标准数量（0-4分）\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第二步：枢纽性检查（逐项计分）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n□ 标准1：影响范围广 — 问题的解决是否影响≥2个相关制度/规范\n   【量化锚定】如果论文问题涉及≥2个法律制度或规范领域，即满足此标准\n   ✅ 满足：论文讨论比例原则→涉及行政法+民法+宪法≥2个制度领域\n   ❌ 不满足：论文只涉及1个具体法律条文\n\n□ 标准2：争议焦点 — 是否是学界长期争论的核心问题\n   【量化锚定】如果论文讨论的争点在学界持续≥10年且有至少2个对立立场，即满足此标准\n   ✅ 满足：比例原则适用范围之争持续30年+、形式法治vs实质法治之争持续20年+\n   ❌ 不满足：论文争点是近3年才出现的新话题，尚无学界争论\n   【强制认定规则】以下争点类型必须认定为满足此标准（不得因论文是法哲学类型而否认其争议焦点性质）：\n   - \"形式法治vs实质法治\"之争 → 满足（持续20年+的核心法学争点）\n   - \"司法公正的正当性基础\"之争（如正义原则能否作为裁判理由） → 满足（涉及裁判理论核心争论）\n   - \"法律与道德关系\"之争 → 满足（法学基础理论核心争点）\n   - 任何涉及法学概念的不同理解路径且存在持续争论的争点 → 只要能说明这是学界争论而非作者自设议题即满足\n\n□ 标准3：理论基础 — 是否涉及法学基本原理或核心概念\n   【量化锚定】如果论文问题涉及法学基础概念（正义、权利、权力、法治、比例原则等）或法学基本原理，即满足此标准\n\n□ 标准4：制度连锁 — 问题的解决是否需要调整≥2个制度\n   【量化锚定】如果论文提出的方案或结论需要修改/调整≥2个制度或规范，即满足此标准\n   【法哲学论文适配】法哲学论文讨论司法公正/裁判正当性等基础问题，其结论如果改变了裁判理由的构成方式或司法制度的正当性基础，就涉及至少2个制度领域（如裁判制度+司法制度）。不得因为法哲学论文没有提出具体的制度修改方案就否认其制度连锁效应。只要论文结论隐含需要调整≥2个制度或规范领域，即满足此标准。\n\
    \   ✅ 满足（法哲学论文）：论文论证同理心正义可作为裁判正当性基础→涉及裁判制度+司法制度≥2个制度领域\n   ✅ 满足（制度论文）：论文建议比例原则适用于私域→涉及行政法+民法≥2个制度领域\n   【校准约束】法哲学论文满足此标准的前提是：论文结论确实隐含需要调整≥2个制度或规范领域的具体论证（而非仅因为讨论了\"司法公正\"这一宏观主题就自动满足）。如果论文只是在理论层面讨论正义概念而未论证其对具体制度的影响，不满足此标准。\n\n枢纽性得分 = 满足的标准数量（0-4分）\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第三步：材料/方法贡献校验（不单独计分，只作上限校验）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n逐项回答：\n1. 作者是否把新案例、新材料、新概念、新政策或新比较对象作为主要创新依据？\n2. 如果是，原文是否明确说明它改变了问题设定、解释路径、规范命题或结论推进？\n3. 如果只是“材料新/案例新/概念新”，但没有实质推进，触发 material_novelty_without_thesis，上限70分，并返回 review_flags: [\"material_novelty_overclaim\"]。\n\n说明：该校验不用于给额外加分，只用于防止把材料新颖误判为研究创新。\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第四步：确定分数\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n评分锚定规则（先按此规则确定分档，再在档内微调）：\n\n┌────────────┬────────────┬─────────────────┐\n│ 可争辩性    │ 枢纽性      │ 分档             │\n├────────────┼────────────┼─────────────────┤\n│ ≥3         │ ≥2         │ excellent(80-100)│\n│ ≥3         │ 1          │ good(70-79)      │\n│ ≥2         │ ≥2         │ good(60-69)      │\n│ ≥2       \
    \  │ ≤1         │ marginal(50-59)  │\n│ ≤1         │ 任意       │ unacceptable     │\n│            │            │ (0-49，触发上限) │\n└────────────┴────────────┴─────────────────┘\n\n【上限规则】：\n1. 可争辩性 ≤ 1 → 最高 50 分（no_justiciable_question）\n2. 可争辩性 = 2 但问题表述过于宏大无法聚焦 → 最高 65 分（weak_problem_formulation）\n3. 主要依赖材料/案例/概念新颖但无实质研究推进 → 最高 70 分（material_novelty_without_thesis）\n多个上限规则同时触发时，取最低上限。\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第五步：维度边界\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n- 本维度评：问题本身是否成立且重要\n- 不评：文献综述是否充分（现状洞察度）\n- 不评：论文的论证是否严密（逻辑严密性）\n- 不评：材料是否真正支撑结论（逻辑严密性）\n\n不要把\"首次研究\"\"现实意义重大\"\"题目宏大\"直接当作高分依据。\n不要把\"新案例\"\"新材料\"\"新概念\"直接当作高分依据。\n\n【字数要求】（本维度总计不超过500字）：\n- evidence_quotes：最多2条，每条不超过80字\n- strengths/weaknesses：各最多2条，每条不超过50字\n- limit_rule_triggered：每条不超过60字\n- boundary_note：不超过60字\n- summary：不超过50字\n- core_judgment：不超过80字\n- score_rationale：不超过120字，必须包含可争辩性得分、枢纽性得分和材料/方法校验结论\n\n输出必须满足 output_contract：\n- score 不得缺失\n- review_flags 无触发时返回 [\"none\"]\n- limit_rule_triggered 无触发时返回 []\n\n请输出\
    \ JSON：\n{\n  \"dimension\": \"problem_originality\",\n  \"score\": <0-100整数>,\n  \"band\": \"excellent|good|marginal|unacceptable\",\n  \"summary\": \"一句话摘要\",\n  \"core_judgment\": \"一句话说明该维是否成立\",\n  \"score_rationale\": \"可争辩性=X/4，枢纽性=Y/4，材料新颖性未/已触发上限，锚定___档，给___分\",\n  \"evidence_quotes\": [\"引用1\", \"引用2\"],\n  \"strengths\": [\"优势1\"],\n  \"weaknesses\": [\"缺陷1\"],\n  \"limit_rule_triggered\": [\n    {\n      \"rule_id\": \"problem_originality.no_justiciable_question\",\n      \"rule\": \"规则描述\",\n      \"score_ceiling\": 50,\n      \"priority\": 1,\n      \"evidence\": \"触发该规则的具体证据\"\n    }\n  ],\n  \"boundary_note\": \"说明本维度只评什么、不评什么\",\n  \"review_flags\": [\"problem_validity_unclear|material_novelty_overclaim|boundary_overlap|evidence_thin|mandatory_expert_review|none\"]\n}\n"
- key: literature_insight
  name_zh: 现状洞察度
  name_en: Literature Insight
  weight: 0.2
  position: 2
  position_name: 定位
  ai_difficulty: medium
  description: '评估论文是否讲清楚既有研究已走到哪里、核心争点是什么、本文切入的未竟点在哪里。默认采用文内证据模式：评分以研究地图三要素+争点结构为主，法学流派数量为辅助锚定（非必要条件）。外部文献库/RAG 仅作为增强模式的风险提示，不替代文内证据评分。

    '
  evaluate:
  - 逐项检查三要素（到达点/未竟点/本文切入点），每项0/1/2分
  - 检查论文是否呈现了可区分的争点结构（对立观点、解释路径分歧、制度方案分歧）
  - 按法学流派定义统计识别的法学流派数量（辅助锚定，非高分必要条件）
  - 根据三要素总分+争点结构+法学流派数量的锚定表确定分档
  - 判断作者是否建立了研究地图，而不只是罗列观点
  - 判断本文问题是否因文献定位而变得不可回避
  - 仅在系统显式提供外部检索结果时，检查外部文献是否提示遗漏关键争点；该信息只触发复核风险，不直接替代评分
  do_not_evaluate:
  - 不要把参考文献数量直接当成高分
  - 不要要求模型凭空判断'顶刊近5年覆盖率'这类外部统计
  - 不要把名家引用堆砌误判为洞察
  - 不要把纯哲学/纯心理学资源误判为法学流派
  - 不要把作者自己在正文中并列介绍的概念关系，直接当成学界流派覆盖
  - 不要凭模型自身记忆或不可回溯的外部知识裁定文献是否遗漏
  - 不要用外部文献库结果直接给高分或低分；外部结果只能作为复核提示
  ceiling_rules:
  - rule_id: literature_insight.no_research_map
    trigger: 三要素总分≤1（研究地图严重残缺：到达点、未竟点、本文切入点中至少两项缺失或仅有空泛表述）
    score_ceiling: 55
    priority: 1
    severity: critical
    detection_method: 逐项检查三要素得分（0/1/2），计算总分。若三要素总分≤1则触发。具体检查：(1)到达点是否有至少1个具体研究成果+贡献；(2)未竟点是否明确指出具体争议或缺口；(3)本文切入点是否与未竟点直接对应
    examples:
    - 文献综述只罗列观点，无法区分到达点与未竟点，三要素总分=0
    - 只说'已有研究不足'但未说明到达点与具体不足，三要素总分=1
    - 文献堆砌无研究地图构造，到达点和未竟点均缺失
  - rule_id: literature_insight.insufficient_school_coverage
    trigger: 争点结构=0 且法学流派识别≤1（论文只引用单一流派观点或仅罗列文献而无争点结构；若三要素总分≥4且争点结构≥1，即使流派≤1也不触发）
    score_ceiling: 65
    priority: 2
    severity: major
    detection_method: 先判断争点结构得分，再按法学流派定义逐个统计。只有争点结构=0且有效法学流派≤1时触发；若论文虽未标明多个流派，但已呈现对立观点、解释路径分歧或制度方案分歧，则不触发
    examples:
    - 只引用形式法治派观点，未涉及实质法治派或其他法学争点的对立立场
    - 引用了心理学理论但未说明其在法学层面的对话意义，不算法学流派
    - 罗列多位学者观点但均为同一立场内的重复，仅算1个流派
  - rule_id: literature_insight.partial_map_with_schools
    trigger: 三要素总分≤3但法学流派≥2（研究地图有缺口但流派识别充分，三要素中某项仅为部分满足）
    score_ceiling: 79
    priority: 3
    severity: minor
    detection_method: 计算三要素总分，若≤3且法学流派≥2则触发。此规则不与insufficient_school_coverage同时触发（因为流派≥2已满足覆盖要求），但三要素缺口仍限制分数上限
    examples:
    - 到达点充分(2)、未竟点部分(1)、本文切入点充分(2)，总分=3，但识别了3个法学流派
    - 三要素中某项仅为部分满足，如未竟点只说'存在争议'但未说明争议内容
  scoring_criteria:
    excellent:
      range:
      - 80
      - 100
      indicators:
      - 三要素总分5-6，争点结构>=2（有对立观点或解释路径分歧）
      - 本文问题因其定位而显得不可回避
    good:
      range:
      - 60
      - 79
      indicators:
      - 三要素总分4-5，争点结构>=1 或 法学流派>=2
      - 能说明研究缺口，争点提炼存在
    marginal:
      range:
      - 40
      - 59
      indicators:
      - 三要素总分2-4，争点结构<=1 且 法学流派<=1
      - 有材料但没有形成完整研究地图
    unacceptable:
      range:
      - 0
      - 39
      indicators:
      - 三要素总分0-1
      - 无法说明既有研究已解决什么、未解决什么
  boundary_notes: '与"问题创新性"的边界：

    - 本维度评"既有研究的到达点与未竟点，以及法学流派覆盖"

    - 不评问题本身是否新，那属于问题创新性

    '
  prompt_template: "请对这篇法学论文的【现状洞察度】进行评分（0-100分）。\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n【v0.8 执行模式】文内证据为主，外部文献库只作增强复核\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n默认采用“文内证据模式”：只根据论文正文和参考文献列表判断作者是否建立研究地图。\n\n只有当系统显式提供可回溯的外部检索结果、RAG 引文或文献库摘要时，才启用“外部文献库/RAG 增强模式”。增强模式的作用仅限于：\n- 提示“疑似遗漏关键争点”；\n- 提示“外部文献显示该问题已有成熟争论”；\n- 返回 review_flags: [\"needs_external_context\"] 或 [\"external_context_conflict\"]；\n- 触发专家复核。\n\n外部文献不得替代文内证据直接给高分或低分。若外部知识与文内呈现冲突，应标记复核，而不是由 AI 直接裁断。\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n【v0.8 协议对齐】争点结构优先、流派数量辅助\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n本维度的首要判断口径是\"争点结构\"——论文是否呈现了可区分的争点、对立观点、解释路径分歧或制度方案分歧。法学流派数量是辅助锚定信号，不是高分必要条件。\n\n【重要】不要求集中式文献综述。论文可以采用分散式文献定位——将文献梳理融入正文论证（而非只在独立文献综述部分集中呈现）。只要正文各处能提取出具体的到达点、未竟点和本文切入点，分散式文献定位同样满足三要素要求。不得因为论文没有独立的文献综述章节而判定三要素得分低。\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n【关键提示】流派识别强制规则（必须遵守）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n在开始评分前，请牢记以下强制认定规则：\n\n1. 如果论文讨论”形式法治 vs 实质法治”争论 → 必须计为 2 个流派\n2. 如果论文讨论”法律道德主义 vs 分离论”争论 → 必须计为 2 个流派\n3. 如果论文讨论”机械司法 vs 社会学司法”争论 → 必须计为\
    \ 2 个流派\n4. 如果论文引入”认知心理学与司法裁判交叉研究” → 计为 1 个跨学科法学流派\n5. 如果论文呈现了不同法秩序/制度传统的对立立场（如”一元论主权 vs 清教多元论””君主主权 vs议会主权””单一制 vs 联邦制”等中西宪制分歧） → 每个对立立场计为 1 个法学流派，总计≥2个法学流派\n6. 如果论文呈现了不同解释路径或规范主张的对立（如”德日路径 vs 英美路径””国家有机体论 vs 契约论”等） → 每个对立路径计为 1 个法学流派\n7. 如果论文讨论”本质区分论/效力性vs取缔性/管理性”之争 → 必须计为≥2个法学流派（本质区分论与功能区分论是两种对立的法学解释路径）\n8. 如果论文讨论”利益衡量/比例原则的适用范围”之争 → 必须计为≥2个法学流派（不同适用范围立场构成不同法学解释路径）\n\n【判断标准】：只有当论文明确将这些立场放入”既有学术研究或学界争论脉络”中时，才计算为流派识别。\n作者自己在正文中并列介绍概念关系（如”形式法治强调X，实质法治强调Y”），但未说明这是学界争论，不算流派覆盖。\n【比较法论文特例】如果论文系统呈现了不同法秩序/制度/传统之间的差异和对立，且这些对立涉及法学层面的制度选择、规范命题或解释路径分歧（而非纯历史事实描述），则这些对立立场必须计为法学流派。不得因为论文以历史比较而非现代法学术语呈现这些分歧，就判定”流派数量少”。\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第一步：研究地图三要素检查（逐项计分）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n每项要素评分标准：缺失=0，部分满足=1，充分满足=2\n\n□ 要素1：到达点（既有研究已解决什么）— 得分 0/1/2\n   充分满足（得2分）：至少2个具体研究成果+其贡献，如”张三(2020)通过实证研究证明了XX”\n   部分满足（得1分）：提及已有研究成果但只1个，或贡献描述模糊\n   【重要】理论发展史梳理 + 多位学者观点引述也算到达点，如”学界对XX形成了YY观点和ZZ观点”\n   【重要】比较法论文的到达点可以是：不同法秩序/制度对同一问题的既有解答、既有学术研究中对特定制度起源/构造的共识或误判。分散在正文中的文献定位（而非只在文献综述部分集中呈现）也算有效到达点，只要能提取至少2个具体研究成果和其贡献\n\
    \   缺失（得0分）：只说”已有研究较多”而无具体成果，或纯引文堆叠无贡献提炼\n   搜索关键词：”XX研究指出”、”XX学者认为”、”已有研究表明”、”学界已经”、”理论发展”\n\n□ 要素2：未竟点（缺口在哪里）— 得分 0/1/2\n   充分满足（得2分）：明确指出”但尚未解决XX问题”或”仍存在XX争议”，并说明争议的具体内容\n   部分满足（得1分）：提及研究不足但未说明具体不足之处，或未竟点与本文问题关联松散\n   【重要】比较法论文的未竟点可以是：既有解释路径的局限、既有研究中对制度起源/构造的误判、不同法秩序尚未充分对话的领域\n   【重要】如果论文明确指出”既有研究对XX的判断是错误的/不完整的/有局限的”并且说明了具体错误或局限内容（如”学界将XX的起源归因于YY，但实际上起源于ZZ”），即视为充分满足(2分)。不得因为论文没有在单独的文献综述段落中集中呈现未竟点，而将分散在正文中的未竟点判定为”部分满足”。只要正文中有明确指出既有研究的具体不足或误判并说明内容，就应判定为充分满足。\n   缺失（得0分）：只说”已有研究不足”而无任何具体描述\n   搜索关键词：”但”、”然而”、”尚未”、”仍然”、”争议”、”不足”、”缺乏”\n\n□ 要素3：本文切入点（要解决什么）— 得分 0/1/2\n   充分满足（得2分）：本文研究问题与未竟点直接对应，如”针对上述争议，本文拟从XX角度解决”\n   部分满足（得1分）：有本文切入点表述但与未竟点的对应关系不明确\n   缺失（得0分）：只说”本文研究XX”而未说明与未竟点的关系\n   搜索关键词：”本文”、”笔者”、”拟”、”试图”、”旨在”\n\n三要素总分 = 到达点 + 未竟点 + 本文切入点（0-6分）\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第二步：法学流派识别（逐个统计）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n【法学流派的定义】（必须按此标准判断）：\n\n算法学流派：\n① 法学内部流派：形式法治派/实质法治派、法律道德主义/分离论、规范主义/功能主义等法学理论对立立场\n② 跨学科法学理论：认知心理学与司法裁判交叉研究、现象学与法学交叉理论、实验经济学与法律效果评估等——凡在法学层面有理论对话的跨学科研究方向，算法学相关流派\n\
    ③ 代表性学术立场：围绕同一法学争点形成的不同解释路径或规范主张\n\n不算法学流派：\n④ 纯哲学/纯心理学/纯经济学理论（不涉及法学层面讨论的），如”现象学哲学本身””认知心理学理论本身”\n⑤ 单个学者的孤立观点（无学派归属、无后续讨论）\n⑥ 同一立场内的重复引用（算1个流派，不叠加计数）\n\n搜索关键词：”XX学派”、”XX观点”、”有学者认为”、”另一种观点”、”XX主义”、”学界争论”、”理论分歧”\n\n法学流派数量 = 识别的独立法学流派个数（0-N）\n\n【识别步骤】：\n1. 先搜索关键词，定位可能的流派讨论段落\n2. 检查是否满足”强制认定规则”（见开头提示）\n3. 检查是否明确说明这是”学界争论”或”既有研究的不同立场”\n4. 统计独立流派数量（同一立场重复引用只算1个）\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第三步：争点结构检查（0/1/2分）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n争点结构反映论文是否将既有研究组织为可区分的争辩脉络。\n\n□ 0分：论文只罗列观点，无法区分对立立场或分歧\n□ 1分：论文呈现了至少1个争点或对立观点，但未完整展开分歧结构\n□ 2分：论文呈现了≥2个可区分的争点、对立观点、解释路径分歧或制度方案分歧\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第四步：确定分数（锚定规则）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n【v0.7 协议对齐】争点结构是首要判断口径，法学流派数量为辅助锚定：\n\n┌──────────────┬──────────────┬──────────────┬──────────────────────┐\n│ 三要素总分    │ 争点结构      │ 法学流派数量  │ 分档                  │\n├──────────────┼──────────────┼──────────────┼──────────────────────┤\n│ 5-6          │ ≥2           │ ≥3           │ excellent(85-100)     │\n│ 5-6          │\
    \ ≥2           │ 2            │ good(75-84)           │\n│ 5-6          │ 1            │ ≥2           │ good(75-84)           │\n│ 5-6          │ 1            │ ≤1           │ good(70-79)           │\n│ 4            │ ≥2           │ ≥3           │ good(75-84)           │\n│ 4            │ ≥2           │ 2            │ good(65-74)           │\n│ 4            │ 1            │ ≥2           │ good(65-74)           │\n│ 4            │ ≤1           │ 任意         │ marginal(55-64)①     │\n│ 3            │ ≥2           │ ≥2           │ good上限79②          │\n│ 3            │ 1            │ ≥2           │ good上限79②          │\n│ 3            │ ≤1           │ ≤1           │ marginal(55-64)①     │\n│ 1-2          │ 任意         │ 任意         │ unacceptable(0-54)③   │\n│ 0            │ 任意         │ 任意         │ unacceptable(0-54)④   │\n└──────────────┴──────────────┴──────────────┴──────────────────────┘\n\n【关键变更】：\n- 三要素总分≥4 且 争点结构≥1 → 至少 good(60+)，即使法学流派≤1\n- 法学流派数量不再是高分的必要条件，争点结构是核心判断口径\n- 只有争点结构=0\
    \ 且 法学流派≤1 时，才降到 marginal\n\n① 三要素总分4但争点结构≤1且法学流派≤1：上限65分（触发insufficient_school_coverage）\n② 三要素总分3但法学流派≥2：上限79分（三要素有缺口但流派识别充分，不触发insufficient_school_coverage）\n【v0.8 对齐】如果三要素总分≥4且争点结构≥1，即使法学流派≤1，也不触发insufficient_school_coverage\n③ 三要素总分1-2：研究地图严重残缺，上限55分（触发no_research_map）\n④ 三要素总分0：无研究地图，上限55分（触发no_research_map）\n\n【上限规则】：\n1. 三要素总分 ≤ 1 → 最高55分（no_research_map：研究地图严重残缺）\n2. 争点结构=0 且 法学流派识别≤1 → 最高65分（insufficient_school_coverage：缺少争点结构且流派覆盖不足）\n3. 三要素总分 ≤ 3 且法学流派 ≥ 2 → 最高79分（partial_map_with_schools：三要素有缺口但不触发流派上限）\n4. 外部文献库/RAG 显示可能遗漏关键争点，且文内研究地图较弱 → 不直接改分，但必须返回 external_context_conflict 或 needs_external_context 供专家复核\n多个上限规则同时触发时，取最低上限。\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第四步：维度边界\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n- 本维度评：文献梳理的完整性和深度（研究地图是否清晰、争点结构是否成立、法学流派是否提供辅助锚定）\n- 不评：问题本身是否新颖（问题创新性）\n- 不评：论证是否严密（逻辑严密性）\n\n不要使用\"顶刊近5年覆盖率\"等无法从文内验证的伪量化标准。\n不要凭模型记忆裁定文献遗漏；没有外部检索上下文时，只能标记 needs_external_context。\n\n【字数要求】（本维度总计不超过500字）：\n- evidence_quotes：最多2条，每条不超过80字\n- strengths/weaknesses：各最多2条，每条不超过50字\n\
    - limit_rule_triggered：每条不超过60字\n- boundary_note：不超过60字\n- summary：不超过50字\n- core_judgment：不超过80字\n- score_rationale：不超过120字，必须包含\"三要素得分=X/6，争点结构=Z/2，法学流派=Y个，锚定___档，给___分\"\n\n请输出 JSON：\n{\n  \"dimension\": \"literature_insight\",\n  \"score\": <0-100整数>,\n  \"band\": \"excellent|good|marginal|unacceptable\",\n  \"summary\": \"一句话摘要\",\n  \"core_judgment\": \"一句话说明本维是否成立\",\n  \"score_rationale\": \"三要素=X/6，争点结构=Z/2，法学流派=Y个，锚定___档，给___分\",\n  \"evidence_quotes\": [\"引用1\", \"引用2\"],\n  \"strengths\": [\"优势1\"],\n  \"weaknesses\": [\"缺陷1\"],\n  \"limit_rule_triggered\": [\n    {\n      \"rule_id\": \"literature_insight.no_research_map\",\n      \"rule\": \"规则描述\",\n      \"score_ceiling\": 55,\n      \"priority\": 1,\n      \"evidence\": \"触发该规则的具体证据\"\n    }\n  ],\n  \"boundary_note\": \"说明为什么这是文献定位问题而不是问题创新性\",\n  \"review_flags\": [\"needs_external_context|external_context_conflict|boundary_overlap|evidence_thin|mandatory_expert_review|none\"]\n}\n"
- key: analytical_framework
  name_zh: 理论建构力
  name_en: Analytical Framework Construction
  weight: 0.15
  position: 3
  position_name: 工具
  ai_difficulty: medium
  description: '评估论文是否形成了可操作的分析工具，包括概念界定、类型划分、规范推导步骤或比较分析框架，并且该工具被后文实际调用。跨学科概念只要转化为可操作的法学分析步骤（如裁判规则、司法程序步骤），就不属于"理论贴标签"。

    '
  evaluate:
  - 检查是否有清楚的概念界定、类型化、分析步骤或比较框架
  - 检查该框架是否被后文反复调用，而非只在绪论中出现
  - 检查跨学科概念是否已转化为法学操作层面的分析步骤
  - 若为判例、实证、比较法论文，可额外看裁判规则归纳、研究设计、比较基准是否清楚
  do_not_evaluate:
  - 不要因为术语高级、标签新潮就给高分
  - 不要把材料丰富误判为框架成熟
  - 不要把后文论证连贯性混进本维度，那属于逻辑严密性
  - 不要把跨学科概念直接等同于'理论贴标签'——关键是看是否有法学转化步骤
  - 不要把内容提纲、章节目录或若干原则罗列，直接当成分析框架
  ceiling_rules:
  - rule_id: analytical_framework.no_operational_framework
    trigger: 理论贴标签：核心术语完全无定义、无任何可循的分析步骤、且无法学层面的转化。以下情况不触发此规则：(1)跨学科概念已转化为可操作的法学分析步骤（如裁判规则、司法程序步骤）；(2)概念界定虽跨学科但已有法学层面的操作化步骤（如提供具体裁判适用流程）；(3)框架虽非纯法学概念但已提供法学判断标准或裁判适用指引
    score_ceiling: 50
    priority: 1
    severity: critical
    detection_method: 同时检查三项：(1)核心术语是否有定义；(2)是否有可循的分析步骤；(3)是否有法学转化（裁判规则/司法程序/法律适用步骤）。三项均不满足才触发。若框架来自跨学科但已转化为法学操作步骤，则不触发
    examples:
    - 只说'运用XX理论'但不解释该理论的核心要素，也无任何法学转化步骤
    - 提出类型划分但不说明分类标准和边界，且无法学操作指引
    - 概念前后使用不一致，且未提供法学层面的操作化方案
    anti_examples:
    - 同理心正义虽来自心理学，但已转化为司法裁判四步运作机理（移情联想→位阶排序→反思权衡→理由优化）——有法学转化步骤，不触发
    - 博弈论虽来自经济学，但已转化为立法博弈的三阶段分析框架——有法学转化步骤，不触发
    - 社会学概念'社会分层'已转化为权利位阶排序的判断标准——有法学转化步骤，不触发
  - rule_id: analytical_framework.framework_unused
    trigger: 框架只在绪论出现，后文未真正调用（框架步骤/分类标准在后文出现少于3次，或只用了部分类型且无分析性调用）
    score_ceiling: 60
    priority: 2
    severity: major
    detection_method: 统计框架核心术语/步骤/分类标准在后文中的出现频率；检查是否所有类型/步骤都被使用。理论阐释型调用（后文用框架步骤解释具体法学问题）、类型比对型调用（后文用分类标准比对不同对象）、隐喻映射型调用（后文用结构映射分析不同制度）均算有效调用，不得仅因为后文以理论阐释而非案例应用形式使用框架就判定'未调用'
    examples:
    - 绪论提出三分法，但后文只用了其中一种
    - 框架术语在后文中未再出现或仅出现1-2次，且无任何分析性调用
    anti_examples:
    - 绪论提出四步运作机理，后文虽以理论阐释形式而非按步骤逐一展开，但每章都用框架概念分析具体问题→有效调用，不触发此规则
    - 比较法论文提出横纵双轴框架，后文全文按双轴维度展开比较分析→有效调用，不触发此规则
  scoring_criteria:
    excellent:
      range:
      - 80
      - 100
      indicators:
      - 框架可操作性≥3项（概念界定清晰、分类标准明确、分析步骤可循）
      - 法学转化度≥2项（跨学科概念有法学转化步骤、提供裁判规则或制度方案）
      - 理论型论文：理论推演本身即为法学转化，降低裁判规则要求
    good:
      range:
      - 60
      - 79
      indicators:
      - 框架可操作性≥2项但法学转化度有限
      - 已有较清楚的分析框架，但法学转化不够充分
      - 理论型论文：有概念操作化定义即可
    marginal:
      range:
      - 40
      - 59
      indicators:
      - 框架可操作性≥2项但法学转化度≤1项
      - 有框架雏形，但停留在形式化分类或理论贴标签
      sub_levels:
      - range:
        - 50
        - 59
        indicators: 可操作性≥2且法学转化度=1，有初步法学转化
      - range:
        - 40
        - 49
        indicators: 可操作性=1但法学转化度≥2，框架雏形薄弱但法学转化方向明确
    unacceptable:
      range:
      - 0
      - 39
      indicators:
      - 框架可操作性≤1项（核心术语无定义、无分析步骤）
      - 理论术语堆砌，无法学转化
  boundary_notes: '与"逻辑严密性"的边界：

    - 本维度评"分析工具本身是否成立、可用、有法学转化"

    - 不评这些工具在后续推理中的衔接是否严密，那属于逻辑严密性

    '
  prompt_template: "请对这篇法学论文的【分析框架建构力】进行评分（0-100分）。\n\n【论文类型适配】先判断论文类型，再选择对应的评分参照：\n- 理论型论文（法哲学/概念分析类）：法学转化标准更宽松，理论推演本身即为法学转化，提供概念重构路径即为\"操作指引\"\n- 制度/实务型论文：法学转化标准更严格，要求提供裁判规则、法律适用流程或制度设计方案\n- 判例型论文：裁判规则归纳、案例分类标准即可作为分析框架\n- 比较法论文：比较基准、比较维度和比较方法即为分析框架\n\n【v0.7 协议对齐——政策理论梳理型识别规则】：\n如果论文的主要工作是系统归纳既有立场、权威表述或政策理论（如\"治国理政的法治理念\"\"中国特色社会主义法治道路\"），而非提出原创分析框架，则：\n- 框架可操作性得分上限为 2（只有分类和概念罗列，没有可重复适用的分析步骤或判断标准）\n- 法学转化度得分上限为 1（只是将理论框架映射到制度层面，没有新的操作化转化）\n- 此类论文的分析框架建构力总分通常不超过 60 分\n\n判断标志：\n- 全文以阐释既定立场为主，无原创概念界定或类型化\n- 论文的主要贡献是\"梳理\"\"归纳\"\"阐释\"，而非\"建构\"\"提出\"\"设计\"\n- 框架核心术语来自权威表述而非论文原创\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第一步：框架可操作性检查（逐项计分）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n□ 标准1：概念界定是否清晰\n   满足条件：核心术语有明确定义（如\"本文所称XX是指…\"），内涵和外延可识别\n   ✅ 成立示例：\"本文所称'比例原则'，是指国家干预公民权利时必须满足适当性、必要性、狭义比例性三要件\"\n   ❌ 不成立示例：\"运用同理心正义理论\"（未定义什么是同理心正义、其核心要素是什么）\n\n□ 标准2：分类标准是否明确\n   满足条件：类型划分有边界和区分依据（如\"根据XX标准可分为…\"），不同类型间有明确区分\n   ✅ 成立示例：\"根据干预程度，可将行政行为分为轻度干预、中度干预和重度干预三类\"\n   ❌ 不成立示例：\"有多种类型\"（无分类标准和边界）\n\n□ 标准3：分析步骤是否可循\n\
    \   满足条件：有步骤化的分析流程或判断标准（如\"第一步…第二步…第三步…\"），可按步骤逐步操作\n   ✅ 成立示例：\"判断比例原则需三步：第一步检验适当性，第二步检验必要性，第三步检验狭义比例性\"\n   ❌ 不成立示例：\"需要综合考虑多方面因素\"（无具体步骤）\n\n□ 标准4：后文是否实际调用\n   满足条件：框架核心术语在后文中至少出现3次并发挥分析作用（而非仅出现1-2次）\n   ✅ 成立示例：绪论提出\"四步运作机理\"，后文每个章节都使用该框架进行具体分析\n   ❌ 不成立示例：绪论提出框架术语，后文未再提及或仅出现1次\n   【量化校准】以下情况也算满足此标准：\n   - 框架核心步骤在后文被使用（即使术语名不完全一致，只要分析逻辑与框架步骤对应即可）\n   - 后文至少3处分析段落使用了框架中的分类标准或判断步骤\n   【后文调用形式适配】框架在后文的调用不限于\"按步骤逐一展开\"；以下形式均算有效调用：\n   - 理论阐释型调用：后文用框架概念或步骤解释具体法学问题（如用\"移情联想→位阶排序\"步骤分析司法公正的具体运作）\n   - 类型比对型调用：后文用框架的分类标准对不同对象进行比对或归类\n   - 隐喻映射型调用（比较法论文）：后文用框架的结构映射分析不同制度/传统之间的异同\n   只要后文分析段落的核心逻辑可回溯至框架步骤或分类标准，即视为有效调用。\n   判断方法：在后文中搜索与框架步骤/分类标准对应的论证段落，统计数量≥3即满足。\n\n【额外锚点】：\n- “三个要义”“六个方面”“若干坚持”等内容提纲，如果没有转化为可重复适用的判断步骤或评价标准，不算分析框架。\n- 理论综述或政策阐释中的结构化归纳，只能算主题整理，不能直接按“框架可操作性”高分处理。\n\n【负面模式降档规则 - 与可操作性检查同步执行】：\n在完成上述4项标准检查后，必须同步检查以下负面模式。如果触发，强制降档：\n\nA. 口号式呼吁：统计论文中\"应当\"\"必须\"\"需要完善\"\"需要加强\"等规范性表述的数量。\n   如果≥5处且对应的具体制度方案不足（每个\"应当\"后无具体法条/程序/规则），\n   则框架可操作性得分最高为2（无论上面4项标准满足多少）。\n\nB. 概念堆砌：检查论文核心术语（≥3个）是否每个都有\"\
    本文所称XX是指...\"的明确定义。\n   如果≥2个核心术语无明确定义，\n   则框架可操作性得分最高为1（无论上面4项标准满足多少）。\n\nC. 宏观介绍非深度分析：检查论文是否只完成体系介绍而未触及具体问题。\n   如果全文无任何具体问题的深入分析（只有宏观框架描述），\n   则框架可操作性得分最高为2。\n\n框架可操作性得分 = min(满足的标准数量, 负面模式上限)\n\n框架可操作性得分 = 满足的标准数量（0-4分）\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第二步：法学转化度检查（逐项计分）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n【核心声明】：跨学科概念只要转化为可操作的法学分析步骤（如裁判规则、司法程序步骤、法律适用流程），就不属于\"理论贴标签\"。法学论文允许引入跨学科概念（心理学、经济学、社会学等），但必须将其转化为法学操作层面可使用的分析步骤。纯粹的跨学科理论移植（只说\"运用XX理论\"但不转化为法学操作步骤）才是\"理论贴标签\"。\n\n【法学转化度论文类型适配规则】（判断法学转化度得分时必须遵守）：\n不同论文类型的法学转化表现形式不同，不得用同一标准评判：\n- 理论型论文：法学转化可以是概念操作化定义、适用边界界定、概念间关系映射——理论推演本身即为法学转化\n- 比较法论文：法学转化可以是跨制度/跨传统的类型化对比、比较维度提炼、结构映射分析——将不同法秩序的特征纳入同一分析框架即为法学转化\n- 判例型论文：法学转化可以是裁判规则归纳、案例分类标准——从判例中提炼可重复适用的判断标准即为法学转化\n- 制度型论文：法学转化要求更严格，需要提供裁判规则、法律适用流程或制度设计方案\n\n【比较法论文法学转化度判定规则】（必须遵守）：\n如果论文通过比较分析框架将不同法秩序/制度/传统纳入同一类型化维度进行分析，且后文实际使用了该框架进行具体比较，则：\n- 标准1（跨学科概念转化为法学分析步骤）：比较维度和类型化标准本身就是法学分析步骤→满足\n- 标准2（提供裁判规则或操作指引）：比较基准和比较结论为制度借鉴提供指引→满足（即使是隐喻映射也算，只要映射到法学制度特征）\n不得因为比较框架使用了隐喻、比喻或非纯法学术语而判定\"法学转化度低\"\
    。关键是看框架是否将比较对象纳入法学分析维度（如主权、统一、理性vs权威、秩序、正当性）。\n\n□ 标准1：跨学科概念是否转化为法学分析步骤\n   满足条件：跨学科概念已转化为裁判推理步骤、法律适用流程或法律判断标准\n   ✅ 成立示例：\"同理心正义转化为司法裁判的四步运作机理：移情联想→位阶排序→反思权衡→理由优化\"\n   ❌ 不成立示例：\"运用同理心正义理论分析司法公正\"（未说明如何转化为法学操作）\n\n□ 标准2：是否提供裁判规则或司法程序层面的操作指引\n   满足条件：框架包含裁判规则、判断标准或司法适用流程（而非仅停留在理论阐释层面）\n   ✅ 成立示例：\"在位阶排序步骤中，法官应按权利强度从高到低排列冲突权利\"\n   ✅ 成立示例（理论论文）：论文提供了概念的操作化定义和适用边界（如\"同理心正义适用于XX裁判情境，不适用于YY\"）\n   ❌ 不成立示例：\"同理心正义要求法官体谅当事人\"（停留在情感层面，无裁判操作指引）\n   【v0.7 校准】理论型论文满足此标准的方式可以是：\n   - 提供概念的操作化定义（指明核心要素和适用条件）\n   - 指明概念的适用边界（什么条件下适用、什么条件下不适用）\n   - 给出概念间的关系映射（XX概念与YY概念在法学层面的关系）\n   不必要求具体裁判规则或司法程序方案\n   【理论型论文适配】理论论文满足此标准的方式可以是：提供概念的操作化定义、指明概念的适用边界、给出概念间的关系映射——不必要求具体裁判规则\n\n□ 标准3：是否在制度设计层面给出可操作方案\n   满足条件：框架指向可操作的制度设计或立法建议（而非仅提出理论主张）\n   ✅ 成立示例：\"基于反思权衡步骤，建议在立法中设置权利冲突的三级审查程序\"\n   ❌ 不成立示例：\"应完善相关立法\"（无具体制度方案）\n   【理论型论文适配】理论论文满足此标准的方式可以是：提出理论修正方向、指明概念重构路径——不必要求具体制度设计\n\n□ 标准4：转化后的法学操作步骤是否在后文被实际使用\n   满足条件：法学转化步骤在后文的分析中被反复调用（而非只存在于理论阐述部分）\n   ✅ 成立示例：四步运作机理在后文每个案例分析中都被逐步应用\n   ❌ 不成立示例：理论阐述部分提到四步机理，但案例分析部分并未按步骤展开\n\
    \n法学转化度得分 = 满足的标准数量（0-4分）\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第三步：确定分数\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n评分锚定规则（先按此规则确定分档，再在档内微调）：\n\n┌──────────┬──────────┬─────────────────┐\n│ 可操作性  │ 法学转化度│ 分档             │\n├──────────┼──────────┼─────────────────┤\n│ ≥3       │ ≥2       │ excellent(80-100)│\n│ ≥3       │ 1        │ good(70-79)      │\n│ ≥2       │ ≥2       │ good(60-69)      │\n│ ≥2       │ ≤1       │ marginal(50-59)  │\n│ 1        │ ≥2       │ marginal(40-49)  │\n│ ≤1       │ 任意     │ unacceptable     │\n│          │          │ (0-49，触发上限) │\n└──────────┴──────────┴─────────────────┘\n\n【上限规则】：\n1. 框架可操作性 ≤ 1 → 最高 50 分（no_operational_framework）\n   【重要】以下情况不触发此规则：\n   - 跨学科概念已转化为可操作的法学分析步骤（如裁判规则、司法程序步骤）\n   - 概念界定虽跨学科但已有法学层面的操作化步骤（如\"移情联想→位阶排序→反思权衡→理由优化\"）\n   - 框架虽非纯法学概念，但已提供法学判断标准或裁判适用指引\n   触发条件仅限：核心术语完全无定义 + 无任何可循的分析步骤 + 无法学转化\n2. 框架核心术语在后文出现少于3次且未被实际调用 → 最高 60 分（framework_unused）\n多个上限规则同时触发时，取最低上限。\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第四步：维度边界\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\
    \n- 本维度评：分析框架本身是否成立、可用、有法学转化\n- 不评：框架在推理中的衔接是否严密（逻辑严密性）\n- 不评：问题本身是否新颖（问题创新性）\n\n不要因为术语高级、标签新潮就给高分。\n不要把跨学科概念直接等同于\"理论贴标签\"——关键是看是否有法学转化步骤。\n\n【字数要求】（本维度总计不超过500字）：\n- evidence_quotes：最多2条，每条不超过80字\n- strengths/weaknesses：各最多2条，每条不超过50字\n- limit_rule_triggered：每条不超过60字\n- boundary_note：不超过60字\n- summary：不超过50字\n- core_judgment：不超过80字\n- score_rationale：不超过120字，必须包含框架可操作性得分和法学转化度得分\n\n输出必须满足 output_contract：\n- score 不得缺失\n- review_flags 无触发时返回 [\"none\"]\n- limit_rule_triggered 无触发时返回 []\n\n请输出 JSON：\n{\n  \"dimension\": \"analytical_framework\",\n  \"score\": <0-100整数>,\n  \"band\": \"excellent|good|marginal|unacceptable\",\n  \"summary\": \"一句话摘要\",\n  \"core_judgment\": \"一句话说明该维是否成立\",\n  \"score_rationale\": \"框架可操作性得分=X/4，法学转化度得分=Y/4，锚定___档，给___分\",\n  \"evidence_quotes\": [\"引用1\", \"引用2\"],\n  \"strengths\": [\"优势1\"],\n  \"weaknesses\": [\"缺陷1\"],\n  \"limit_rule_triggered\": [\n    {\n      \"rule_id\": \"analytical_framework.no_operational_framework\",\n      \"rule\": \"\
    规则描述\",\n      \"score_ceiling\": 50,\n      \"priority\": 1,\n      \"evidence\": \"触发该规则的具体证据\"\n    }\n  ],\n  \"boundary_note\": \"说明这是框架建构力问题而不是逻辑衔接问题\",\n  \"review_flags\": [\"concept_instability|boundary_overlap|evidence_thin|none\"]\n}\n"
- key: logical_coherence
  name_zh: 逻辑连贯性
  name_en: Logical Coherence
  weight: 0.2
  position: 4
  position_name: 骨架
  ai_difficulty: medium
  description: '评估论证推进是否形成充分支撑链条：后一步是否回应前一步提出的问题，核心结论能否由前文材料和规范可辩护地推出。

    '
  evaluate:
  - 尝试复述论文的核心推理链
  - 检查关键结论能否由前文材料、案例、规范解释充分支撑并可辩护地推出
  - 检查论文是否处理主要反驳、限制条件和例外情形
  do_not_evaluate:
  - 不要把语言流畅当成逻辑严密
  - 不要把框架有没有提出混进来，那属于分析框架建构力
  - 不要用结论是否讨喜替代推理质量
  ceiling_rules:
  - rule_id: logical_coherence.broken_inference_chain
    trigger: 存在关键跳步：后一步缺少前一步的充分支撑，或核心结论无法由前文材料和规范分析可辩护地推出（至少2处明显跳步）
    score_ceiling: 50
    priority: 1
    severity: critical
    detection_method: 用链条复述测试：尝试用一句话概括每一步推理，检查是否可随意删改；用结论支撑测试：检查核心结论是否得到前文材料/规范分析的充分支撑，能否被可辩护地推出
    examples:
    - 从'现行法存在问题'直接跳到'应采用XX制度'，中间缺少论证
    - 核心结论无法从前文材料或规范分析推导出来
  - rule_id: logical_coherence.weak_local_reasoning
    trigger: 主线连贯但局部论证薄弱（1-2处跳步或反驳处理不足）
    score_ceiling: 70
    priority: 2
    severity: major
    detection_method: 检查主要论证链是否完整；统计局部薄弱环节数量；检查是否处理主要反驳或限制条件
    examples:
    - 主要论证链完整，但个别环节论证不够充分
    - 未处理明显的反对意见或例外情形
  scoring_criteria:
    excellent:
      range:
      - 80
      - 100
      indicators:
      - 能复述清楚的推理链，顺序不可随意颠倒
      - 反例、限制条件或反驳处理充分
    good:
      range:
      - 60
      - 79
      indicators:
      - 主线连贯，主要结论有支撑
      - 存在局部薄弱处，但不伤主骨架
    marginal:
      range:
      - 40
      - 59
      indicators:
      - 部分段落各说各话，呼应不足
      - 从材料直接跳到结论的现象较多
    unacceptable:
      range:
      - 0
      - 39
      indicators:
      - 论证链断裂，关键结论突兀
      - 段落顺序可随意重组而不影响理解
  boundary_notes: '与"分析框架建构力"的边界：

    - 本维度评"框架和材料如何推进结论"

    - 不评框架本身是否新颖可操作，那属于分析框架建构力

    '
  prompt_template: "请对这篇法学论文的【逻辑严密性】进行评分（0-100分）。\n\n【论文类型适配】先判断论文类型，再选择对应的评分参照：\n- 理论型论文（法哲学/法理学/概念分析类）：重点关注理论概念的逻辑推演，反驳处理可以是理论争辩层面的回应\n- 实务型论文（制度设计/立法建议/政策分析类）：重点关注制度方案的逻辑推导，反驳处理需回应实务约束\n- 判例型论文（判例分析/案例研究类）：重点关注案例分析的逻辑链条，允许\"事实→判决\"的较短推理链\n- 比较法论文：重点关注比较基准的一致性和比较结论的推出逻辑\n\n【v0.8 口径校准】本维度统一使用\"充分支撑/可辩护推出/无关键跳步\"。不要把\"必要推出\"作为硬标准，以免误伤解释性、理论性、批判性论文。关键问题不是结论是否唯一可能，而是论文给出的材料、规范依据和推理链是否足以支撑该结论。\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第一步：推理链完整性检查（逐项计分）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n□ 标准1：主要推理步骤是否可复述\n   满足条件：能识别至少3个主要推理步骤，且每一步有明确的逻辑衔接\n   ✅ 成立：\"第一步指出比例原则的宪法地位→第二步分析其民法适用路径→第三步检验具体制度方案\"\n   ❌ 不成立：\"论文提到多个观点但无法串联为推理链\"\n\n□ 标准2：推理链依赖度检查\n   满足条件：每一步推理是否依赖前一步的结论（而非各自独立）\n   检查方法：尝试删除前一步，看后续推理是否因此失去依据\n   ✅ 成立：\"先确立概念定义→再基于定义做类型划分→最后用类型划分做制度分析\"（删除定义后类型划分失去依据）\n   ❌ 不成立：\"三个并列论点，各自独立成立，删掉任何一个不影响其他\"\n\n□ 标准3：关键结论能否由前文推出\n   满足条件：核心结论有前文材料/规范分析/案例推导作为充分支撑，可被辩护地推出\n   ✅ 成立：\"结论'应采用狭义比例性审查'由前文三步审查标准推导而来\"\n   ❌ 不成立：\"结论突兀，前文未铺垫推导路径\"\n\n□ 标准4：是否存在关键跳步\n   满足条件：无≥2处使核心结论无法从前文推出的明显跳步\n   ✅ 成立：\"\
    每个过渡都有论证支撑，核心结论可从前文推出\"\n   ❌ 不成立：\"从'存在制度缺陷'直接跳到'应废除该制度'，核心结论无法推出\"\n   【校准】局部过渡缺详细论证但主线推理链完整（核心结论仍可从前文推出），不算\"关键跳步\"。只有≥2处使核心结论失去前文支撑的跳步才算。\n\n推理链完整性得分 = 满足的标准数量（0-4分）\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第二步：反驳处理度检查（强制枚举清单）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n【强制规则】必须逐项检查以下4种反驳信号，任意1种出现即满足对应标准：\n\n反驳信号清单：\n① 显式反对意见：论文明确写出\"有学者认为XX\"、\"反对者主张YY\"\n② 隐含分歧回应：论文呈现不同理解路径并说明为何选择某路径（理论型论文常见）\n③ 反例/例外处理：论文讨论了反例、例外情形或边界条件\n④ 自身局限承认：论文明确或隐含承认自身论证的适用边界\n\n□ 标准1：识别反对意见（信号①或②满足即可）\n   ✅ 显式：\"有学者认为比例原则不适用于民法私域→本文回应___\"\n   ✅ 隐含（理论论文）：论文呈现了XX概念的不同理解路径并说明为何选择YY路径\n   ❌ 不成立：论文完全不涉及任何反对观点或分歧路径\n\n□ 标准2：实质性回应（信号①+回应论证，或信号②+选择理由）\n   ✅ 显式：\"反对者认为___，但本文通过XX论证表明这一批评的局限在于___\"\n   ✅ 隐含（理论论文）：论文不仅呈现分歧路径，还说明为何选择某路径（有论证而非只罗列）\n   ❌ 不成立：\"只是说'这种观点有缺陷'但不给出论证回应\"\n\n□ 标准3：承认局限（信号④满足即可）\n   ✅ 成立：\"本文论证限于XX条件，在YY情形下可能不适用\"\n   ✅ 成立（理论论文）：论文论证中隐含承认了自身理论的适用边界\n   ❌ 不成立：\"自封终结争论，不承认任何局限\"\n\n反驳处理度得分 = 满足的标准数量（0-3分）\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第三步：确定分数\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n评分锚定规则（先按此规则确定分档，再在档内微调）：\n\
    \n┌────────────┬────────────┬─────────────────┐\n│ 推理链完整性 │ 反驳处理度  │ 分档             │\n├────────────┼────────────┼─────────────────┤\n│ ≥3         │ ≥2         │ excellent(80-100)│\n│ ≥3         │ 1          │ good(70-79)      │\n│ ≥2         │ ≥2         │ good(60-69)      │\n│ ≥2         │ ≤1         │ marginal(50-59)  │\n│ ≤1         │ 任意       │ unacceptable     │\n│            │            │ (0-49，触发上限) │\n└────────────┴────────────┴─────────────────┘\n\n【上限规则】：\n1. 推理链完整性 ≤ 1 → 最高 50 分（broken_inference_chain）\n2. 推理链完整性 = 2 但反驳处理度 = 0 → 最高 70 分（weak_local_reasoning）\n多个上限规则同时触发时，取最低上限。\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第四步：维度边界\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n- 本维度评：推理链是否形成充分支撑链条，结论是否可由前文可辩护地推出\n- 不评：框架本身是否可操作（分析框架建构力）\n- 不评：结论是否可被共同体接受（结论可接受性）\n\n不要把\"写得顺\"误判为\"论证严\"。不要把结论是否讨喜替代推理质量。\n\n【字数要求】（本维度总计不超过500字）：\n- evidence_quotes：最多2条，每条不超过80字\n- strengths/weaknesses：各最多2条，每条不超过50字\n- limit_rule_triggered：每条不超过60字\n- boundary_note：不超过60字\n- summary：不超过50字\n- core_judgment：不超过80字\n\
    - score_rationale：不超过120字，必须包含推理链完整性得分和反驳处理度得分\n\n输出必须满足 output_contract：\n- score 不得缺失\n- review_flags 无触发时返回 [\"none\"]\n- limit_rule_triggered 无触发时返回 []\n\n请输出 JSON：\n{\n  \"dimension\": \"logical_coherence\",\n  \"score\": <0-100整数>,\n  \"band\": \"excellent|good|marginal|unacceptable\",\n  \"summary\": \"一句话摘要\",\n  \"core_judgment\": \"一句话说明本维是否成立\",\n  \"score_rationale\": \"推理链完整性得分=X/4，反驳处理度得分=Y/3，锚定___档，给___分\",\n  \"evidence_quotes\": [\"引用1\", \"引用2\"],\n  \"strengths\": [\"优势1\"],\n  \"weaknesses\": [\"缺陷1\"],\n  \"limit_rule_triggered\": [\n    {\n      \"rule_id\": \"logical_coherence.broken_inference_chain\",\n      \"rule\": \"规则描述\",\n      \"score_ceiling\": 50,\n      \"priority\": 1,\n      \"evidence\": \"触发该规则的具体证据\"\n    }\n  ],\n  \"boundary_note\": \"说明为什么这是逻辑链问题而不是框架问题\",\n  \"review_flags\": [\"counterargument_missing|boundary_overlap|evidence_thin|none\"]\n}\n"
- key: conclusion_consensus
  name_zh: 学术共识度
  name_en: Conclusion Acceptability
  weight: 0.1
  position: 5
  position_name: 落脚
  ai_difficulty: high
  description: '评估论文结论能否进入法学共同体语境并被认真回应，且在制度、判例、实践约束下具有可接受性。采用双轨操作化：轨道A评估共同体对话度，轨道B评估制度可接受度。对法哲学/理论类论文，轨道B主要看结论是否与现有法秩序逻辑兼容（而非要求具体制度方案）。

    '
  evaluate:
  - 轨道A：检查结论是否回应了法学共同体已有争论，能否被反对者定位和回应
  - 轨道A：检查结论在中国法学语境中是否说得通，论文是否主动承认并讨论反对意见
  - 轨道B：检查结论是否不与现行法秩序根本矛盾
  - 轨道B：检查结论是否对制度/实务约束有所回应（对理论论文，原则层面回应即可）
  - 轨道B：对制度论文检查是否指出制度转化的可能方向（不要求具体方案）；对理论论文如有此项可加分，但不是达标前提
  do_not_evaluate:
  - 不要把接近主流立场直接当作高分
  - 不要把'大家可能喜欢'等同于可接受性
  - 不要把未来研究价值混进来，那属于前瞻延展性
  - 不要对法哲学论文要求具体裁判规则或程序衔接方案——理论论文的贡献在于理论层面
  - 不要因理论论文未给出未来制度转化方向而直接扣分——这更接近前瞻延展性
  - 不要因为结论与中国法秩序或官方法治话语高度一致，就直接给高分
  ceiling_rules:
  - rule_id: conclusion_consensus.no_community_dialogue
    trigger: 结论自说自话：无法被法学共同体定位和回应，不回应任何已有争论，反对者无从进入对话
    score_ceiling: 50
    priority: 1
    severity: critical
    detection_method: 检查结论是否：(1)回应了共同体已有争论；(2)能被反对者定位；(3)在中国法学语境中说得通；(4)承认了反对意见或自身局限。若4项均不满足，则触发
    examples:
    - 结论提出全新观点但不说明与既有争论的关系，反对者无从进入对话
    - 结论只有'应该XX'的政策表态，无法被法学共同体当作学术观点来回应
    - 结论直接移植外国理论，不考虑中国法学语境的适配性
    anti_examples:
    - 法哲学论文提出新理论框架但承认其局限并讨论与现行法秩序的关系——有共同体对话，不触发
    - 挑战主流但给出反对者可定位的论证路径——有对话，不触发
  - rule_id: conclusion_consensus.no_institutional_grounding
    trigger: 制度论文（实证/制度/判例分析类）结论未锚定任何现行规范、程序或裁判规则；或理论论文结论与现行法秩序根本矛盾且无任何回应
    score_ceiling: 50
    priority: 2
    severity: critical
    detection_method: 先判断论文类型：(a)制度论文——检查结论是否提及现行规范、程序或裁判规则；(b)理论论文——检查结论是否与现行法秩序根本矛盾且无回应。制度论文无制度锚定→触发；理论论文根本矛盾且无回应→触发
    examples:
    - 制度论文：结论提出改革方案但未提及任何现行法条、程序或裁判规则
    - 理论论文：结论主张推翻现行法秩序的基本逻辑，且未讨论这一主张的影响或回应任何反对
    anti_examples:
    - 法哲学论文提出新正义理论框架，虽无具体制度方案，但讨论了该理论与现行法治原则的关系并承认局限——不触发
    - 法哲学论文结论能与现行法治传统对话，对规范约束回应偏原则化——不触发
    - 制度论文结论虽不完美但明确锚定《民法典》某条并讨论适用路径——不触发
  - rule_id: conclusion_consensus.vague_recommendations
    trigger: 制度论文结论停留在'完善立法、加强监管、健全机制'等万能药表述，缺乏具体制度路径
    score_ceiling: 65
    priority: 3
    severity: major
    detection_method: 仅适用于制度论文：检查对策建议是否具体到法条、程序或裁判规则层面。理论论文若已在原则层面回应法秩序和中国语境，即使没有未来制度转化方向，也不触发此规则。
    examples:
    - 制度论文：对策建议只有'应完善立法'、'应加强监管'，无具体路径
    anti_examples:
    - 理论论文：结论未写未来制度改革路径，但已说明与现行法秩序逻辑兼容——不触发
    - 理论论文：结论说'这一理论框架可为XX制度改革提供正当化基础'——有方向，不触发
    - 制度论文：结论具体指出应修改《XX法》第X条并说明理由——不触发
  scoring_criteria:
    excellent:
      range:
      - 80
      - 100
      indicators:
      - 共同体对话度≥3且制度可接受度≥3（制度论文）或≥2（理论论文）
      - 能进入共同体核心争论，并给出可被认真回应的理由
      - 制度衔接清楚（制度论文），或与法秩序逻辑兼容（理论论文）
    good:
      range:
      - 60
      - 79
      indicators:
      - 共同体对话度≥2且制度可接受度≥2
      - 具备共同体对话意识和制度可接受性
      - 反驳处理未达最佳，或制度转化方向不够具体
    marginal:
      range:
      - 40
      - 59
      indicators:
      - 共同体对话度≥1或制度可接受度=1
      - 有结论，但回应对象模糊
      - 对策泛化，与制度语境贴合不足
    unacceptable:
      range:
      - 0
      - 39
      indicators:
      - 共同体对话度=0或制度可接受度=0
      - 万能药式对策，缺乏制度约束分析
      - 无法被共同体定位和回应
  boundary_notes: '与"前瞻延展性"的边界：

    - 本维度评"当下能否被共同体和制度语境接受、回应"

    - 不评文章是否打开后续研究空间，那属于前瞻延展性

    - 本维度评"结论本身能否被接受"，不评"论证过程是否严密"（逻辑严密性）

    '
  prompt_template: "请对这篇法学论文的【结论可接受性】进行评分（0-100分）。\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第零步：判断论文类型\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n先判断论文属于哪类（影响轨道B的评判标准）：\n- 理论论文：以法哲学、法理学、概念辨析、正当性论证为主，结论在理论层面\n- 制度论文：以实证分析、制度设计、判例分析、比较法为主，结论在制度层面\n- 混合论文：既有理论论证又有制度分析\n\n【重要声明】：法哲学/理论类论文的贡献在于理论层面，不要求提供具体裁判规则或程序衔接方案。对理论论文，轨道B\"制度可接受度\"主要看结论是否与现有法秩序逻辑兼容（而非要求具体制度方案），只要结论不与现行法秩序根本矛盾且对制度语境有所回应，轨道B标准即可通过。制度转化方向可作为加分项，不是理论论文达标前提。\n【重要补充】：与中国法秩序或官方法治话语高度一致，只能说明制度兼容性较强，不能单独推出高分。\n【重要补充】：如果论文只是复述既定立场、没有把结论转化为可争辩的学术主张，也没有回应反对意见，共同体对话度通常≤1，总分通常不得超过50。\n【v0.8 复核例外】：本维只是风险筛查和总分上限项。若汇总时出现\"研究创新性>=80 且逻辑严密性>=75，但本维<60\"，不得直接视为差稿，必须进入专家复核，由专家判断其是否属于高创新高争议论文。\n【v0.8 边界】：不要判断结论最终是否会被学界接受；不要把非主流、激进、批判性结论直接判为低价值。真正扣分的是无法进入共同体语境、无法被认真回应，或制度/理论约束完全无回应。\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第一步：轨道A——共同体对话度（逐项计分）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n□ 标准1：结论回应了法学共同体已有争论\n   满足条件：结论明确说明与既有争论/观点的关系（赞同、修正或挑战）\n   ✅ 成立示例：\"本文结论修正了张三关于XX的观点，认为应从YY角度理解\"\n   ❌ 不成立示例：结论只提出新观点，不说明与既有争论的关系（自说自话）\n\n□ 标准2：结论能被反对者定位和回应（不是自说自话）\n   满足条件：反对者能清楚知道该结论在争论中的位置，并能构造反驳路径\n\
    \   ✅ 成立示例：挑战主流但给出反对者可反驳的具体论点\n   ❌ 不成立示例：结论只是\"XX很重要\"的表态，反对者无从进入对话\n\n□ 标准3：结论在中国法学语境中说得通\n   满足条件：结论考虑了中国制度语境，而非直接移植外国理论\n   【重要】只要结论提及中国制度背景（如民法典编纂、现行法条）即可，不要求深入讨论\"本土法学传统局限\"\n   ✅ 成立示例：结论讨论了该观点在中国法治传统中的定位\n   ✅ 成立示例：结论结合中国民法典编纂语境展开（即使未讨论局限性）\n   ❌ 不成立示例：直接移植外国制度/理论，完全不考虑中国语境\n\n□ 标准4：论文主动承认并讨论了反对意见或自身局限\n   满足条件：结论部分或全文讨论了可能的反对意见，或承认自身论证的局限\n   ✅ 成立示例：\"虽然本文主张XX，但这一主张面临YY挑战，需要进一步论证\"\n   ❌ 不成立示例：结论部分完全不提及任何反对意见或局限\n\n【负面模式降档规则 - 与对话度/制度度检查同步执行】：\n在完成上述标准检查后，必须同步检查以下负面模式。如果触发，强制降档：\n\nA. 生搬硬套：检查结论是否采用\"立法-司法-执法-守法\"或类似机械四分法。\n   如果采用机械框架且每个方面都无具体论证（只有空泛表述），\n   则共同体对话度得分最高为1（因为机械套用无法被学界认真回应）。\n\nB. 万能药式对策：检查对策建议是否全部停留在\"完善立法、加强监管、健全机制\"层面。\n   如果对策≥3条且全部为空泛表述（无具体法条/程序/规则），\n   则制度可接受度得分最高为1。\n\nC. 结论不足以支撑主张：检查论文是否提出新理论作为替代方案但未说明优势。\n   如果新理论未明确说明相对既有理论的优势，\n   则共同体对话度得分最高为2。\n\n共同体对话度得分 = 满足的标准数量（0-4分）\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第二步：轨道B——制度可接受度（逐项计分）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n□ 标准1：结论不与现行法秩序根本矛盾\n   满足条件：结论不主张推翻现行法秩序的基本逻辑（即使挑战具体规则，整体兼容）\n   ✅ 成立示例：结论挑战具体制度设计但与法治原则兼容\n\
    \   ❌ 不成立示例：结论主张现行法秩序在根本逻辑上不可接受且无任何回应\n\n□ 标准2：对制度/实务约束有所回应\n   对制度论文：结论回应了具体制度约束（法条、程序、裁判规则）\n   对理论论文：结论在原则层面回应了制度约束（如讨论与现行法治原则的关系）\n   ✅ 制度论文成立示例：\"考虑到《民法典》第XX条的限制，建议采用YY解释路径\"\n   ✅ 理论论文成立示例：\"这一理论框架与现行法治传统的关系是___\"（原则层面即可）\n   ❌ 不成立示例：结论完全不提及任何制度/实务约束\n\n□ 标准3：结论指出了制度转化的可能方向（不要求具体方案）\n   满足条件：结论至少指出了理论/方案在制度层面可能如何落实的方向\n   ✅ 成立示例：\"这一理论框架可为XX制度改革提供正当化基础\"\n   ✅ 成立示例（理论论文）：\"虽然本文未设计具体制度方案，但指出XX原则可为未来立法提供方向\"\n   ❌ 不成立示例：结论只说\"具有重要意义\"，完全不讨论与制度的可能关联\n   【说明】对理论论文，此项可作为加分项，不是轨道B达标的必要条件；不要因理论论文未给出未来制度转化方向而直接扣分\n   【理论论文最低成立锚点】：\n   - ✅ 满足：论文明确指出\"本文理论可为XX制度/实践提供YY方向的正当化基础\"（有具体指向）\n   - ✅ 满足：论文说明\"本文框架可在ZZ条件下指导裁判/立法/制度设计\"（有适用条件）\n   - ❌ 不满足：论文只说\"具有重要理论意义和实践价值\"（无具体指向）\n   - ❌ 不满足：论文完全不讨论理论与制度/实践的可能关联\n\n□ 标准4：结论考虑了中国制度语境（而非直接移植外国制度）\n   满足条件：结论讨论了在中国的制度条件下如何适用或转化\n   ✅ 成立示例：结论讨论了外国经验在中国制度语境下的适配性\n   ❌ 不成立示例：直接移植外国制度，不考虑中国制度条件\n\n制度可接受度得分 = 满足的标准数量（0-4分）\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第三步：确定分数\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n评分锚定规则（先按此规则确定分档，再在档内微调）：\n\n制度论文：\n┌──────────────┬──────────────┬─────────────────┐\n\
    │ 对话度(A)     │ 制度度(B)    │ 分档             │\n├──────────────┼──────────────┼─────────────────┤\n│ ≥3           │ ≥3           │ excellent(80-100)│\n│ ≥3           │ 2            │ good(70-79)      │\n│ ≥2           │ ≥2           │ good(60-69)      │\n│ ≥2           │ ≤1           │ marginal(50-59)  │\n│ ≤1           │ 任意         │ unacceptable     │\n│              │              │ (0-49)           │\n└──────────────┴──────────────┴─────────────────┘\n\n理论论文（轨道B权重降低，触发条件放宽）：\n┌──────────────┬──────────────┬─────────────────┐\n│ 对话度(A)     │ 制度度(B)    │ 分档             │\n├──────────────┼──────────────┼─────────────────┤\n│ ≥3           │ ≥2           │ excellent(80-100)│\n│ ≥3           │ 1            │ good(70-79)      │\n│ ≥2           │ ≥1           │ good(60-69)      │\n│ ≥1           │ ≥1           │ marginal(50-59)  │\n│ ≤1 或 B=0    │ 任意         │ unacceptable     │\n│              │              │ (0-49)           │\n└──────────────┴──────────────┴─────────────────┘\n\n【上限规则】：\n\
    1. 共同体对话度=0 → 最高50分（no_community_dialogue）\n2. 制度论文制度可接受度=0 → 最高50分（no_institutional_grounding）\n3. 理论论文制度可接受度=0且结论与现行法秩序根本矛盾 → 最高50分（no_institutional_grounding）\n4. 制度论文万能药对策 → 最高65分（vague_recommendations）\n多个上限规则同时触发时，取最低上限。\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n第四步：维度边界\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n- 本维度评：结论当下能否被共同体和制度语境接受、回应\n- 不评：论证过程是否严密（逻辑严密性）\n- 不评：是否打开后续研究空间（前瞻延展性）\n\n注意：\n- 挑战主流不扣分\n- 真正扣分的是无法进入共同体语境、无法被认真回应\n- 法哲学论文的\"制度可接受度\"看逻辑兼容，不要求具体制度方案\n\n【字数要求】（本维度总计不超过500字）：\n- evidence_quotes：最多2条，每条不超过80字\n- strengths/weaknesses：各最多2条，每条不超过50字\n- limit_rule_triggered：每条不超过60字\n- boundary_note：不超过60字\n- summary：不超过50字\n- core_judgment：不超过80字\n- score_rationale：不超过120字，必须包含共同体对话度得分和制度可接受度得分\n\n输出必须满足 output_contract：\n- score 不得缺失\n- review_flags 无触发时返回 [\"none\"]\n- limit_rule_triggered 无触发时返回 []\n\n请输出 JSON：\n{\n  \"dimension\": \"conclusion_consensus\",\n  \"score\": <0-100整数>,\n  \"band\": \"excellent|good|marginal|unacceptable\",\n  \"summary\": \"一句话摘要\",\n  \"core_judgment\"\
    : \"一句话说明该维是否成立\",\n  \"score_rationale\": \"共同体对话度得分=X/4，制度可接受度得分=Y/4，锚定___档，给___分\",\n  \"evidence_quotes\": [\"引用1\", \"引用2\"],\n  \"strengths\": [\"优势1\"],\n  \"weaknesses\": [\"缺陷1\"],\n  \"limit_rule_triggered\": [\n    {\n      \"rule_id\": \"conclusion_consensus.no_community_dialogue\",\n      \"rule\": \"规则描述\",\n      \"score_ceiling\": 50,\n      \"priority\": 1,\n      \"evidence\": \"触发该规则的具体证据\"\n    }\n  ],\n  \"boundary_note\": \"说明这是可接受性问题而不是未来延展性问题\",\n  \"review_flags\": [\"community_dialogue_gap|boundary_overlap|evidence_thin|mandatory_expert_review|none\"]\n}\n"
- key: forward_extension
  name_zh: 前瞻延展性
  name_en: Forward Extension
  weight: 0.05
  position: 6
  position_name: 开放
  ai_difficulty: low
  description: '评估论文是否在现有论证基础上打开下一轮研究、制度讨论或解释路径，而不是用口号式展望拔高。

    '
  evaluate:
  - 检查论文是否基于正文论证提出后续研究或争论路径
  - 检查作者是否说明反对者应从哪里进入下一轮争论
  - 对判例分析、实务指南类论文保持克制，避免因文体特点误伤
  do_not_evaluate:
  - 不要奖励与正文脱节的宏大展望
  - 不要因为'方向很大'就给高分
  - 不要用本维度弥补前四维和结论可接受性的缺陷
  ceiling_rules:
  - rule_id: forward_extension.slogan_outlook
    trigger: 全无具体后续方向 + 仅有空泛拔高表述（如'具有重大意义''前景广阔''将继续努力完善'等），延展实质度得分=0
    score_ceiling: 50
    priority: 1
    severity: critical
    detection_method: 只有空泛拔高且没有具体待修正对象、后续争点、制度/理论修正路径或文体适配的延展方向时才触发。论文主动承认局限并提出修正方向、提出具体后续研究问题、指出理论修正路径、给出制度完善方向、说明案例/实务延伸路径或比较法深化方向时均不触发。
    examples:
    - 只说'具有重大理论意义和实践价值'，无任何具体延展路径
    - 展望部分只有'前景广阔''值得进一步关注'等空泛表述
    - 自封终结争论，无任何后续方向
    anti_examples:
    - 论文承认'本文对偏见风险的处理尚不充分'并提出'法官素养培育应从XX机制入手'→不算口号式展望，不触发此规则
    - 论文提出'同理心正义的适用边界需在YY理论框架下进一步厘清'→有理论深化方向，不触发
    - 法哲学论文指明'XX概念应从YY方向重构'→有理论修正路径，不触发
    - 论文说'未来可从比较法角度研究XX制度'→有比较法深化方向，不触发slogan_outlook
  scoring_criteria:
    excellent:
      range:
      - 80
      - 100
      indicators:
      - 形成清晰、可定位且与正文结论衔接的下一轮研究、制度、理论或实务路径
      - 原始分 >= 80 时按 scoring_protocol 映射为最高 5 分弱加分
    good:
      range:
      - 60
      - 79
      indicators:
      - 至少有一个具体延展路径，并能说明该路径如何承接正文论证
      - 原始分 >= 60 时按 scoring_protocol 映射为 3 分弱加分
    marginal:
      range:
      - 40
      - 59
      indicators:
      - 延展方向存在但较概括、证据较少或与正文衔接需要推断
      - 原始分 >= 40 时按 scoring_protocol 映射为 2 分弱加分
    unacceptable:
      range:
      - 0
      - 39
      indicators:
      - 只有空泛拔高且没有具体待修正对象时，才进入0-39低分段
      - 全无具体后续方向，用口号式展望替代延展
  boundary_notes: '与"结论可接受性"的边界：

    - 本维度评"未来还能往哪里走"

    - 不评"当下是否能被共同体接受"，那属于结论可接受性

    '
  prompt_template: "请对这篇法学论文的【前瞻延展性】进行评分（0-100分）。\n\n【本维度角色】\n前瞻延展性不直接加权计入总分，只在满足前置条件时作为弱加分项。不得用本维度补救研究创新性、现状洞察度、分析框架建构力、逻辑严密性或结论可接受性的缺陷。\n\n唯一计分口径：代码按 scoring_protocol.bonus_dimension.bands 将原始分映射为 bonus。\n- 原始分 >= 80 → bonus=5\n- 原始分 >= 60 → bonus=3\n- 原始分 >= 40 → bonus=2\n- 原始分 < 40 → bonus=0\n\n加分前提：逻辑严密性>=60，结论可接受性>=60，四个核心维度均>=50；否则汇总层 bonus=0。你仍需给出本维度原始分，供排序、分歧分析和复核使用。\n\n【论文类型适配】\n先判断论文类型，再选择对应的延展形态；不要求形成完整未来研究设计。\n- 理论型论文：理论深化方向、概念修正路径、新理论假设，不要求实证研究设计。\n- 判例/实务型论文：案例适用边界、实务改进路径、裁判规则延伸，不要求理论体系重构。\n- 制度/立法型论文：制度完善方向、规则衔接问题、实施风险控制，不要求完成具体条文方案。\n- 比较法论文：比较框架深化、新比较维度、本土化延伸，不要求穷尽所有法域。\n\n【有效延展信号】\n满足以下任一类且能在原文中定位证据，即可认为存在真实延展路径：\n1. 提出具体后续研究问题或下一轮争点。\n2. 指明理论、概念、制度、实务或比较框架的修正/深化方向。\n3. 承认正文的具体局限，并说明后续应围绕该局限如何推进。\n4. 说明不同意见者可从何处进入争论，或给出可继续检验的反驳入口。\n5. 对判例、实务或制度适用给出边界条件、风险控制或场景延伸。\n\n【低分约束】\n只有空泛拔高且没有具体待修正对象时，才进入0-39低分段。\n下列情形属于低分：只说“具有重大意义”“前景广阔”“值得进一步研究”“继续努力完善”，但没有说明具体问题、对象、机制、概念边界、制度路径或实务场景。\n下列情形不应直接压低：论文提出宏观但可定位的制度完善方向；理论论文指出概念修正路径；判例/实务论文说明适用边界；比较法论文提出可继续比较的维度。\n\n【评分锚定】\n- 80-100：延展路径清晰、可定位，并与正文核心结论紧密衔接；足以支持最高弱加分。\n\
    - 60-79：存在明确延展路径，与正文论证有可解释衔接，但路径精细度或证据展开仍有限。\n- 40-59：存在延展方向，但较概括、证据较少或与正文衔接需要推断；仍可支持低档弱加分。\n- 0-39：没有真实延展路径，或只有口号式展望、意义拔高和泛泛“继续研究”。\n\n【复核提示】\n若前瞻延展性明显高于前四维表现，必须返回 mandatory_expert_review 或 future_claim_thin，供汇总环节检查是否用展望补救前四维缺陷。\n若证据片段无法支撑延展路径，返回 evidence_thin。\n\n【维度边界】\n- 本维度评：未来还能往哪里走。\n- 不评：当下结论能否被共同体接受，那属于结论可接受性。\n- 不评：论证过程是否严密，那属于逻辑严密性。\n\n【字数要求】（本维度总计不超过500字）：\n- evidence_quotes：最多2条，每条不超过80字。\n- strengths/weaknesses：各最多2条，每条不超过50字。\n- limit_rule_triggered：仅在触发 slogan_outlook 时填写，否则返回 []。\n- score_rationale：不超过120字，必须说明原始分对应的 bonus 档位。\n\n请输出 JSON：\n{\n  \"dimension\": \"forward_extension\",\n  \"score\": <0-100整数>,\n  \"band\": \"excellent|good|marginal|unacceptable\",\n  \"summary\": \"一句话摘要\",\n  \"core_judgment\": \"一句话说明该维是否存在真实延展路径\",\n  \"score_rationale\": \"说明原始分、bonus档位和主要证据\",\n  \"evidence_quotes\": [\"引用1\", \"引用2\"],\n  \"strengths\": [\"优势1\"],\n  \"weaknesses\": [\"缺陷1\"],\n  \"limit_rule_triggered\": [\n    {\n      \"rule_id\": \"forward_extension.slogan_outlook\"\
    ,\n      \"rule\": \"规则描述\",\n      \"score_ceiling\": 50,\n      \"priority\": 1,\n      \"evidence\": \"触发该规则的具体证据\"\n    }\n  ],\n  \"boundary_note\": \"说明为什么这是未来延展问题而不是当下可接受性问题\",\n  \"review_flags\": [\"future_claim_thin|boundary_overlap|evidence_thin|mandatory_expert_review|none\"]\n}\n"
evaluation_chain:
  description: v0.8 六维递进判断链。维度可并发评分，但汇总解释和复核必须按命题与定位→工具与论证→风险与延展的顺序检查，禁止倒置补救。
  sequence:
  - dimension: problem_originality
    reason: 命题：先看是否提出可争辩的法学问题，且不把材料新颖直接等同于创新
  - dimension: literature_insight
    reason: 定位：再看作者是否建立文内研究地图并呈现争点结构
  - dimension: analytical_framework
    reason: 工具：再看是否形成可操作、可复用且有法学转化的分析框架
  - dimension: logical_coherence
    reason: 论证：再看这些工具和材料能否充分支撑并可辩护地推出结论
  - dimension: conclusion_consensus
    reason: 风险：再看结论能否进入共同体与制度语境；高创新低可接受性进入专家复核
  - dimension: forward_extension
    reason: 延展：最后看论文是否基于正文打开下一轮争论；不得补救前四维缺陷
governance_appendix:
  note: 本附录用于研究校准和系统治理，不直接进入单模型评分 prompt
  discrimination_threshold:
    description: 好/坏论文的总分差距，用于检验框架区分度
    levels:
    - level: 显著差异
      threshold: 50
      action: 区分度良好
    - level: 明显差异
      threshold: 30
      action: 可接受，但边界样本需复核
    - level: 区分不足
      threshold: 0
      action: 需重审 rubric 或权重
  expert_review_triggers:
    dimension_triggers:
    - dimension: problem_originality
      condition: 触发问题虚化、热点拼接、材料新颖性误判风险或边界高度模糊
    - dimension: conclusion_consensus
      condition: 出现共同体对话缺口、制度可接受性争议或高分异常
    - dimension: literature_insight
      condition: 外部文献库/RAG 提示遗漏关键争点，且文内研究地图较弱
    - dimension: precheck.academic_ethics
      condition: 任何学术伦理疑点均进入人工或外部工具复核
    overall_triggers:
    - condition: 总分高但任一核心维度明显低
      action: 高分异常复核
    - condition: 研究创新性>=80 且 逻辑严密性>=75，但结论可接受性<60
      action: 不得自动判差；必须由专家判断是否属于高创新高争议论文
    - condition: 材料或案例非常新，但逻辑严密性<60 或证据无法证明材料改变论证推进
      action: 标记材料创新误判风险，进入专家复核
    - condition: AI 给出高总分，但任一主评分维度证据片段不足或无法定位
      action: 证据不足高分复核
    - condition: 前瞻延展性显著高于前四维表现
      action: 检查是否用展望补救前四维缺陷
    - condition: 多模型维度分布异常一致
      action: 怀疑 rubric 迎合，提升人工抽检优先级
  cross_dimension_consistency:
    description: 跨维度一致性检查规则，用于识别不合理的评分组合
    rules:
    - condition: 问题创新性 < 40 且 前瞻延展性 > 70
      flag: inconsistent_innovation_extension
      reason: 问题虚化的论文不太可能有真实延展价值
      action: 标记为异常，需人工复核
    - condition: 逻辑严密性 < 50 且 结论可接受性 > 70
      flag: inconsistent_logic_consensus
      reason: 论证断裂的论文结论难以被共同体接受
      action: 标记为异常，需人工复核
    - condition: 现状洞察度 < 40 且 分析框架建构力 > 75
      flag: inconsistent_literature_framework
      reason: 文献定位不清的论文难以建立有效框架
      action: 标记为异常，需人工复核
    - condition: 问题创新性 >= 80 且 逻辑严密性 >= 75 且 结论可接受性 < 60
      flag: high_innovation_low_acceptability
      reason: 可能是高创新高争议论文，也可能是自说自话；AI 不应自动裁断
      action: 必须进入专家复核
    - condition: 问题创新性 >= 80 且 review_flags 包含 material_novelty_overclaim
      flag: material_novelty_high_score_risk
      reason: 高创新分可能主要来自材料或案例新颖性误判
      action: 必须进入专家复核
    - condition: 最终分 >= 80 且 任一主评分维度 evidence_quotes 为空或无法定位
      flag: high_score_evidence_gap
      reason: 高分缺少可审计证据，不符合 v0.8 证据优先原则
      action: 必须进入专家复核
    - condition: 现状洞察度 review_flags 包含 external_context_conflict
      flag: external_literature_conflict
      reason: 外部文献库提示可能遗漏关键争点，且 AI 不应直接裁断
      action: 进入专家复核
    - condition: 所有维度评分标准差 < 5
      flag: suspiciously_uniform
      reason: 所有维度评分过于一致，可能是AI未区分维度
      action: 标记为异常，需人工复核
  validation_plan:
    description: 以正样本、负样本和中等样本校准 v2.35 的区分度、维度边界与 v0.8 强制复核规则
    steps:
    - 用三组正样本验证高质量论文不会塌缩成'所有维度都差不多高'
    - 用三组负样本验证问题虚化、文献形式化、理论贴标签能够被明显压分
    - 加入至少三组中等样本，验证及格线判断和边界案例
    - 专项检查挑战主流但论证扎实的论文，避免误伤结论可接受性
    - 专项检查新案例/新材料/新概念论文，验证材料新颖性不会单独推高问题创新性
    - 专项检查外部文献库/RAG 增强模式，验证外部冲突只触发复核提示，不直接替代文内评分
    - 专项检查高创新低可接受性组合，验证必须进入专家复核
    - 专项检查同一证据片段跨维重复计分问题
  reliability_verification:
    multi_model_consensus:
      recommended_models: 3
      max_models: 5
      thresholds:
        high_confidence: 标准差 <= 5
        medium_confidence: 标准差 > 5 且 <= 8
        low_confidence: 标准差 > 8，需人工复核
    system_risks:
    - risk: 维度相关性持续升高
      description: 六维度评分的Pearson相关系数过高，说明区分度退化
      detection: 计算六维度评分的Pearson相关系数矩阵
      threshold: 0.7
      action: 如果平均相关系数>0.7则预警，需重审 rubric
    - risk: 高分异常样本增多
      description: 总分很高但某个核心维度很低的样本比例过高
      detection: 统计'总分>90且任一维度<60'的样本比例
      threshold: 0.05
      action: 如果比例>5%则预警，可能是AI过度拟合某些维度
    - risk: 同一证据片段被多维反复引用
      description: 同一段文本被多个维度作为evidence_quotes引用
      detection: 提取所有evidence_quotes，计算跨维度重复率
      threshold: 0.3
      action: 如果重复率>30%则预警，说明维度边界仍需收窄
    - risk: ceiling_rules触发率过低
      description: 上限规则很少被触发，可能是规则定义过严或AI未执行
      detection: 统计各ceiling_rule的触发频率
      threshold: 0.02
      action: 如果某规则触发率<2%（在负样本中），需检查规则定义或prompt
    - risk: review_flags使用率过低
      description: AI很少标记review_flags，可能是过度自信
      detection: 统计各review_flag的使用频率
      threshold: 0.05
      action: 如果所有样本中review_flags使用率<5%，需检查prompt或增加不确定性样本
  sample_anchors:
    note: 样本锚点用于校准和验证，不直接进入评分prompt
    positive:
    - paper: 林来梵《民法典编纂的宪法学透析》
      type: 理论型
      source: 法学研究 2016年第4期
    - paper: 蒋红珍《比例原则位阶秩序的司法适用》
      type: 理论型+判例分析
      source: 法学研究 2020年第4期
    - paper: 章志远《迈向公私合作型行政法》
      type: 理论型
      source: 法学研究 2019年第2期
    negative:
    - paper: 《论新质生产力区域协调发展的法治化之道》
      type: 追热点型
      reason: 追热点式选题，问题虚构
    - paper: 《行政机关采集人脸信息活动的法治因应》
      type: 概念混乱型
      reason: 概念混乱，理论仅为装饰
    - paper: 《对外援助立法论纲》
      type: 文献形式化型
      reason: 文献梳理流于形式，无问题意识
    notes: '【待补充】：

      1. 多元类型正样本：判例分析型、实证研究型、比较法型论文

      2. 负样本详细信息：发表来源、各维度得分、加权总分

      3. 中等质量样本：60-75分的及格线样本

      '
